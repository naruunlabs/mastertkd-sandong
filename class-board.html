) { isPaused = !isPaused; document.getElementById('pause-btn').innerText = isPaused ? \"재개\" : \"일시정지\"; }\r\n        function resetToMenu() { clearInterval(timerInterval); setupMenu.style.display = 'flex'; controls.style.display = 'none'; }\r\n        function toggleFullScreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }\r\n    \u003c/script>\r\n\u003c/body>\r\n\u003c/html>"},{"name":"순발력 게임","html":"\u003c!DOCTYPE html>\r\n\u003chtml lang=\"ko\">\r\n\u003chead>\r\n    \u003cmeta charset=\"UTF-8\">\r\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no\">\r\n    \u003ctitle>국가대표마스터태권도장 순발력 훈련기\u003c/title>\r\n    \u003cstyle>\r\n        /* 웹폰트(Pretendard) 적용 및 기본 설정 */\r\n        \r\n        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Pretendard', sans-serif; overflow: hidden; background-color: #222; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }\r\n        #screen { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: background-color 0.12s ease-in-out; }\r\n        \r\n        /* 메뉴 화면 스타일 */\r\n        #menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(30, 30, 30, 0.98); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; padding: 20px; box-sizing: border-box; }\r\n        .menu-title { color: white; margin-bottom: 5px; font-size: min(2.5rem, 8vw); text-shadow: 2px 2px 4px rgba(0,0,0,0.5); text-align: center; }\r\n        .menu-sub { color: #aaa; margin-bottom: 30px; font-size: min(1.2rem, 4vw); text-align: center; }\r\n        \r\n        /* 버튼 그룹 스타일 */\r\n        .mode-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-bottom: 25px; width: 100%; max-width: 650px; }\r\n        .btn { padding: 18px; font-size: 1.2rem; font-weight: bold; cursor: pointer; border: none; border-radius: 15px; background: #eee; color: #333; box-shadow: 0 5px 15px rgba(0,0,0,0.2); transition: all 0.1s; flex: 1; min-width: 130px; }\r\n        .btn:active { transform: scale(0.96); }\r\n        .btn-auto { background: #3498DB; color: white; }\r\n        .btn-random { background: #E67E22; color: white; width: 100%; max-width: 650px; }\r\n\r\n        /* 작아진 전체화면 버튼 */\r\n        .btn-fullscreen { \r\n            margin-top: 25px; \r\n            padding: 10px 25px; \r\n            font-size: 1rem; \r\n            font-weight: bold;\r\n            background: #27AE60; \r\n            color: white; \r\n            border: none;\r\n            border-radius: 25px;\r\n            cursor: pointer;\r\n            box-shadow: 0 3px 8px rgba(0,0,0,0.3);\r\n            transition: background-color 0.2s;\r\n        }\r\n        .btn-fullscreen:hover { background: #219653; }\r\n\r\n        /* 훈련 화면 요소 (안내문구, 워터마크) */\r\n        #info { font-size: min(6rem, 15vw); font-weight: 900; color: white; text-align: center; text-shadow: 3px 3px 20px rgba(0,0,0,0.7); user-select: none; z-index: 10; pointer-events: none; line-height: 1.2; }\r\n        #dojang-name { position: absolute; bottom: 25px; right: 25px; font-size: min(2rem, 5vw); font-weight: 700; color: rgba(255,255,255,0.15); user-select: none; pointer-events: none; text-transform: uppercase; letter-spacing: -1px; }\r\n        \r\n        /* 상단 컨트롤 (메뉴로 돌아가기) */\r\n        .controls { position: absolute; top: 20px; right: 20px; z-index: 50; }\r\n        .sub-btn { padding: 10px 16px; background: rgba(0,0,0,0.3); color: rgba(255,255,255,0.8); border: 1px solid rgba(255,255,255,0.3); border-radius: 8px; cursor: pointer; font-weight: bold; display: none; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); font-size: 0.9rem;}\r\n    \u003c/style>\r\n\u003cstyle>\n:root{color-scheme:dark;--board:#171a16;--surface:#24281f;--edge:#454b3d;--ink:#f5f7eb;--quiet:#c8cfbe;--mint:#d6f570;--amber:#ffba78}\nhtml,body{background:var(--board)!important;color:var(--ink)!important}\nbody,button,input,select,textarea{font-family:system-ui,\"Malgun Gothic\",sans-serif!important}\nh1,h2,h3{letter-spacing:-.04em}h1,h2,h3,strong{color:inherit}\nbutton{border-radius:10px!important;background:var(--surface)!important;border:1px solid var(--edge)!important;color:var(--ink)!important;box-shadow:none!important;text-shadow:none!important;font-weight:700!important}\nbutton:hover:not(:disabled){border-color:var(--mint)!important}\nbutton:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--mint);outline-offset:3px}\nbutton:disabled{opacity:.46}\ninput:not([type=checkbox]):not([type=radio]),select,textarea{background:#1d211a!important;border:1px solid var(--edge)!important;color:var(--ink)!important;border-radius:8px!important}\ninput::placeholder,textarea::placeholder{color:var(--quiet)!important}\ninput[type=checkbox],input[type=radio],progress{accent-color:var(--mint)}\n.primary,.start-btn,.start-big-btn,#toggle,#start,#draw,button.active,button[aria-pressed=true]{background:var(--mint)!important;color:#1e2811!important;border-color:var(--mint)!important}\n#timer,#time-display,#result,.solo-time,.duo-time,.relay-current-time,.result-time,#best-record-info{font-variant-numeric:tabular-nums;letter-spacing:-.055em;text-shadow:none!important}\n@keyframes board-reveal{from{opacity:.65;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}\n@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}\n#menu{background:var(--board)}.menu-title{margin:0 0 28px;text-shadow:none}#info{text-shadow:0 2px 8px #000}#dojang-name,.menu-sub{display:none}#screen{transition:none}.mode-group,.btn-random{max-width:600px}.menu-title{font-size:clamp(1.6rem,5vw,2.6rem)}\u003c/style>\u003c/head>\r\n\u003cbody>\r\n\r\n    \u003cdiv id=\"menu\">\r\n        \u003ch1 class=\"menu-title\">순발력 게임\u003c/h1>\r\n        \u003cp class=\"menu-sub\">반응 속도 & 순발력 훈련 시스템\u003c/p>\r\n        \r\n        \u003cdiv class=\"mode-group\">\r\n            \u003cbutton class=\"btn\" onclick=\"startMode('manual')\" style=\"flex-basis: 100%;\"> 수동\u003c/button>\r\n        \u003c/div>\r\n\r\n        \u003cdiv style=\"color: #ddd; margin-bottom: 10px; font-weight: bold; font-size: 0.9rem;\"> 자동 모드 속도 선택\u003c/div>\r\n        \u003cdiv class=\"mode-group\">\r\n            \u003cbutton class=\"btn btn-auto\" onclick=\"startMode('auto', 1000)\">1초 (상급)\u003c/button>\r\n            \u003cbutton class=\"btn btn-auto\" onclick=\"startMode('auto', 2000)\">2초 (중급)\u003c/button>\r\n            \u003cbutton class=\"btn btn-auto\" onclick=\"startMode('auto', 3000)\">3초 (기초)\u003c/button>\r\n            \u003cbutton class=\"btn btn-auto\" onclick=\"startMode('auto', 4000)\">4초 (유아)\u003c/button>\r\n        \u003c/div>\r\n\r\n        \u003cbutton class=\"btn btn-random\" onclick=\"startMode('random')\"> 무작위\u003c/button>\r\n        \r\n        \u003cbutton class=\"btn-fullscreen\" onclick=\"toggleFullScreen()\"> 전체 화면 전환\u003c/button>\r\n    \u003c/div>\r\n\r\n    \u003cdiv class=\"controls\">\r\n        \u003cbutton id=\"back-btn\" class=\"sub-btn\" onclick=\"goToMenu()\"> 메뉴로\u003c/button>\r\n    \u003c/div>\r\n\r\n    \u003cdiv id=\"screen\" onclick=\"handleScreenClick()\">\r\n        \u003cdiv id=\"info\">준비...\u003cbr>화면 터치!\u003c/div>\r\n        \u003cdiv id=\"dojang-name\">국가대표마스터태권도장\u003c/div>\r\n    \u003c/div>\r\n\r\n    \u003cscript>\r\n        // 색상 팔레트 (눈이 편안한 톤다운 컬러)\r\n        const colors = ['#E74C3C', '#3498DB', '#2ECC71', '#F1C40F', '#9B59B6', '#E67E22'];\r\n        let currentMode = '';\r\n        let timer = null;\r\n        let selectedInterval = 3000;\r\n        \r\n        const screen = document.getElementById('screen');\r\n        const menu = document.getElementById('menu');\r\n        const backBtn = document.getElementById('back-btn');\r\n        const info = document.getElementById('info');\r\n\r\n        // 오디오 컨텍스트 초기화 (사용자 상호작용 후 활성화)\r\n        let audioCtx = null;\r\n        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }\r\n\r\n        // 비프음 재생 함수\r\n        function playBeep() {\r\n            if (!audioCtx) initAudio(); // 첫 터치 시 오디오 초기화 확실하게\r\n            if (audioCtx.state === 'suspended') audioCtx.resume(); // 절전 모드 해제\r\n\r\n            const oscillator = audioCtx.createOscillator();\r\n            const gainNode = audioCtx.createGain();\r\n            oscillator.connect(gainNode);\r\n            gainNode.connect(audioCtx.destination);\r\n\r\n            oscillator.type = 'triangle'; // 부드러운 사인파\r\n            oscillator.frequency.setValueAtTime(800, audioCtx.currentTime); // 주파수(Hz)\r\n            gainNode.gain.setValueAtTime(0.48, audioCtx.currentTime); // 볼륨 (0.0 ~ 1.0)\r\n\r\n            oscillator.start(audioCtx.currentTime);\r\n            oscillator.stop(audioCtx.currentTime + 0.08); // 0.08초 동안 짧게 재생\r\n        }\r\n\r\n        function changeColor() {\r\n            let newColor;\r\n            do {\r\n                newColor = colors[Math.floor(Math.random() * colors.length)];\r\n            } while (newColor === screen.style.backgroundColor);\r\n            screen.style.backgroundColor = newColor;\r\n            playBeep();\r\n        }\r\n\r\n        function startMode(mode, interval) {\r\n            initAudio(); // 모드 시작 시 오디오 준비\r\n            currentMode = mode;\r\n            selectedInterval = interval || 3000;\r\n            menu.style.display = 'none';\r\n            backBtn.style.display = 'block';\r\n            screen.style.backgroundColor = '#222';\r\n            info.style.display = 'block';\r\n            info.innerHTML = \"준비...\u003cbr>화면 터치!\";\r\n        }\r\n\r\n        function handleScreenClick() {\r\n            // 훈련 시작 전 대기 상태일 때\r\n            if (info.style.display !== 'none') {\r\n                info.style.display = 'none';\r\n                runTraining();\r\n                return;\r\n            }\r\n            // 수동 모드 클릭\r\n            if (currentMode === 'manual') changeColor();\r\n        }\r\n\r\n        function runTraining() {\r\n            changeColor(); // 첫 번째 색상 즉시 실행\r\n            if (currentMode === 'auto') {\r\n                timer = setInterval(changeColor, selectedInterval);\r\n            } else if (currentMode === 'random') {\r\n                setRandomTimer();\r\n            }\r\n        }\r\n\r\n        function setRandomTimer() {\r\n            if (currentMode !== 'random') return;\r\n            const randomTime = Math.floor(Math.random() * 3000) + 1200; // 1.2초 ~ 4.2초 랜덤\r\n            timer = setTimeout(() => {\r\n                changeColor();\r\n                setRandomTimer();\r\n            }, randomTime);\r\n        }\r\n\r\n        function goToMenu() {\r\n            clearInterval(timer); clearTimeout(timer);\r\n            currentMode = '';\r\n            menu.style.display = 'flex';\r\n            backBtn.style.display = 'none';\r\n            info.style.display = 'block';\r\n            screen.style.backgroundColor = '#222';\r\n            info.innerHTML = \"준비...\u003cbr>화면 터치!\";\r\n        }\r\n\r\n        function toggleFullScreen() {\r\n            if (!document.fullscreenElement && !document.webkitFullscreenElement) {\r\n                if (document.documentElement.requestFullscreen) {\r\n                    document.documentElement.requestFullscreen();\r\n                } else if (document.documentElement.webkitRequestFullscreen) { // 사파리/구형 브라우저 대비\r\n                    document.documentElement.webkitRequestFullscreen();\r\n                }\r\n            } else {\r\n                if (document.exitFullscreen) {\r\n                    document.exitFullscreen();\r\n                } else if (document.webkitExitFullscreen) {\r\n                    document.webkitExitFullscreen();\r\n                }\r\n            }\r\n        }\r\n    \u003c/script>\r\n\u003c/body>\r\n\u003c/html>"},{"name":"순발력 측정기","html":"\u003c!DOCTYPE html>\r\n\u003chtml lang=\"ko\">\r\n\u003chead>\r\n    \u003cmeta charset=\"UTF-8\">\r\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no\">\r\n    \u003ctitle>순발력 측정기 - 국가대표마스터태권도장\u003c/title>\r\n    \u003cstyle>\r\n        \r\n        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Pretendard', sans-serif; overflow: hidden; background-color: #1a1a1a; color: white; user-select: none; }\r\n        #main-screen { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; transition: background-color 0.1s; }\r\n        \r\n        #msg { font-size: min(4rem, 8vw); font-weight: bold; text-align: center; pointer-events: none; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }\r\n        #result { font-size: min(12rem, 25vw); font-weight: 900; display: none; pointer-events: none; }\r\n        \r\n        /* 상단 역대 최고 기록 (터치 시 이름 수정 가능) */\r\n        #hall-of-fame { position: absolute; top: 80px; text-align: center; background: rgba(241, 196, 15, 0.15); padding: 15px 40px; border-radius: 50px; border: 2px solid #F1C40F; color: #F1C40F; box-shadow: 0 0 20px rgba(241, 196, 15, 0.2); cursor: pointer; z-index: 200; transition: transform 0.1s; }\r\n        #hall-of-fame:active { transform: scale(0.95); }\r\n        #hall-of-fame span { font-size: 1rem; display: block; opacity: 0.7; margin-bottom: 5px; }\r\n        #best-record-info { font-size: 2.2rem; font-weight: 800; }\r\n        #edit-hint { font-size: 0.8rem; color: #aaa; margin-top: 5px; font-weight: normal; }\r\n\r\n        #history { position: absolute; left: 20px; bottom: 20px; background: rgba(0,0,0,0.7); padding: 18px; border-radius: 15px; width: 240px; pointer-events: none; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(5px); }\r\n        #history h3 { margin: 0 0 12px 0; color: #aaa; border-bottom: 1px solid #444; padding-bottom: 8px; font-size: 1rem; text-align: center; }\r\n        #record-list { list-style: none; padding: 0; margin: 0; font-family: monospace; font-size: 1.1rem; }\r\n        #record-list li { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.05); padding: 4px 0; color: #ddd; }\r\n        \r\n        .waiting { background-color: #1a1a1a !important; }\r\n        .ready { background-color: #E67E22 !important; }\r\n        .target { background-color: #2ECC71 !important; }\r\n        .too-fast { background-color: #E74C3C !important; }\r\n\r\n        #logo { position: absolute; top: 20px; left: 20px; font-size: 1.2rem; font-weight: bold; color: rgba(255,255,255,0.3); }\r\n        .controls { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; z-index: 200; }\r\n        .sub-btn { padding: 8px 15px; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.3); border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: bold; }\r\n    \u003c/style>\r\n\u003cstyle>\n:root{color-scheme:dark;--board:#171a16;--surface:#24281f;--edge:#454b3d;--ink:#f5f7eb;--quiet:#c8cfbe;--mint:#d6f570;--amber:#ffba78}\nhtml,body{background:var(--board)!important;color:var(--ink)!important}\nbody,button,input,select,textarea{font-family:system-ui,\"Malgun Gothic\",sans-serif!important}\nh1,h2,h3{letter-spacing:-.04em}h1,h2,h3,strong{color:inherit}\nbutton{border-radius:10px!important;background:var(--surface)!important;border:1px solid var(--edge)!important;color:var(--ink)!important;box-shadow:none!important;text-shadow:none!important;font-weight:700!important}\nbutton:hover:not(:disabled){border-color:var(--mint)!important}\nbutton:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--mint);outline-offset:3px}\nbutton:disabled{opacity:.46}\ninput:not([type=checkbox]):not([type=radio]),select,textarea{background:#1d211a!important;border:1px solid var(--edge)!important;color:var(--ink)!important;border-radius:8px!important}\ninput::placeholder,textarea::placeholder{color:var(--quiet)!important}\ninput[type=checkbox],input[type=radio],progress{accent-color:var(--mint)}\n.primary,.start-btn,.start-big-btn,#toggle,#start,#draw,button.active,button[aria-pressed=true]{background:var(--mint)!important;color:#1e2811!important;border-color:var(--mint)!important}\n#timer,#time-display,#result,.solo-time,.duo-time,.relay-current-time,.result-time,#best-record-info{font-variant-numeric:tabular-nums;letter-spacing:-.055em;text-shadow:none!important}\n@keyframes board-reveal{from{opacity:.65;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}\n@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}\n#logo,#edit-hint{display:none}#hall-of-fame,#history{background:var(--surface);border:1px solid var(--edge);box-shadow:none;border-radius:12px;color:var(--ink)}#main-screen.waiting{background:var(--board)!important}#main-screen.ready{background:#594023!important}#main-screen.target{background:#455826!important;box-shadow:inset 0 0 0 10px var(--mint)}#main-screen.too-fast{background:#702f21!important;box-shadow:inset 0 0 0 10px var(--amber)}#main-screen{transition:none}#msg{text-shadow:none}html,body{height:100%;overflow:auto}body{display:grid;grid-template-columns:clamp(140px,20vw,240px) minmax(0,1fr);grid-template-rows:auto minmax(160px,1fr);gap:12px;padding:clamp(12px,2vw,24px);box-sizing:border-box}.controls,#hall-of-fame,#history{position:static;width:auto;min-width:0}.controls{grid-area:1/2;align-self:center;justify-content:flex-end;flex-wrap:wrap}#hall-of-fame{grid-area:1/1;justify-self:start;align-self:center;max-width:100%;box-sizing:border-box;padding:10px 16px;text-align:left;overflow-wrap:anywhere}#best-record-info{font-size:clamp(1rem,3vw,1.5rem)}#main-screen{grid-area:2/2;min-height:0;height:auto;box-sizing:border-box;border:1px solid var(--edge);border-radius:14px;padding:14px;gap:10px}#msg{font-size:clamp(1.2rem,4vw,2.8rem);max-width:100%;overflow-wrap:anywhere}#result{font-size:clamp(3rem,min(19vw,24vh),11rem);line-height:1;color:var(--mint)}#history{grid-area:2/1;align-self:start;padding:12px 16px}#history h3{border:0;text-align:left;margin:0;padding:0 0 4px}#record-list{display:grid;gap:0;font-variant-numeric:tabular-nums}#record-list li{gap:8px;padding:9px 0;border-bottom:1px solid var(--edge)}#record-list li:last-child{border:0}@media(max-width:500px){body{grid-template-columns:1fr;grid-template-rows:auto auto minmax(160px,1fr) auto}.controls{grid-area:1/1}.controls button{padding:6px 8px}#hall-of-fame{grid-area:2/1}#main-screen{grid-area:3/1}#history{grid-area:4/1}}\u003c/style>\u003c/head>\r\n\u003cbody onclick=\"handleClick()\">\r\n\r\n    \u003cdiv id=\"logo\">국가대표마스터태권도장\u003c/div>\r\n    \r\n    \u003cdiv class=\"controls\">\r\n        \u003cbutton class=\"sub-btn\" onclick=\"clearAllData(event)\">기록 초기화\u003c/button>\r\n        \u003cbutton class=\"sub-btn\" onclick=\"toggleFullScreen(event)\">전체 화면\u003c/button>\r\n    \u003c/div>\r\n\r\n    \u003cdiv id=\"hall-of-fame\" onclick=\"editBestName(event)\">\r\n        \u003cspan> 최고 기록 · 이름 수정\u003c/span>\r\n        \u003cdiv id=\"best-record-info\">대기 중...\u003c/div>\r\n        \u003cdiv id=\"edit-hint\">※ 기록 달성 후 여기서 이름을 바꾸세요\u003c/div>\r\n    \u003c/div>\r\n\r\n    \u003cdiv id=\"main-screen\" class=\"waiting\">\r\n        \u003cdiv id=\"msg\">화면을 터치하면 시작\u003c/div>\r\n        \u003cdiv id=\"result\">0.000s\u003c/div>\r\n    \u003c/div>\r\n\r\n    \u003cdiv id=\"history\">\r\n        \u003ch3>오늘의 기록\u003c/h3>\r\n        \u003cul id=\"record-list\">\r\n            \u003cli>-\u003c/li>\r\n        \u003c/ul>\r\n    \u003c/div>\r\n\r\n    \u003cscript>\r\n        let state = 'waiting', startTime, timer, sessionRecords = [];\r\n        const screen = document.getElementById('main-screen'), msg = document.getElementById('msg'), result = document.getElementById('result'), recordList = document.getElementById('record-list'), bestInfo = document.getElementById('best-record-info');\r\n        let audioCtx;\r\n\r\n        window.onload = loadBestRecord;\r\n\r\n        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }\r\n        function playSound(freq, duration, vol=0.1) {\r\n            initAudio(); if(audioCtx.state==='suspended') audioCtx.resume();\r\n            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();\r\n            osc.connect(gain); gain.connect(audioCtx.destination);\r\n            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);\r\n            gain.gain.setValueAtTime(Math.min(0.65, vol * 2.8), audioCtx.currentTime);\r\n            osc.start(); osc.stop(audioCtx.currentTime + duration);\r\n        }\r\n\r\n        function handleClick() {\r\n            if (state === 'waiting' || state === 'result') startReady();\r\n            else if (state === 'ready') tooFast();\r\n            else if (state === 'target') finishTest();\r\n        }\r\n\r\n        function startReady() {\r\n            state = 'ready'; screen.className = 'ready';\r\n            msg.style.display = 'block'; result.style.display = 'none';\r\n            msg.innerText = '색이 바뀌면 즉시 터치!!';\r\n            const delay = Math.floor(Math.random() * 3500) + 1500;\r\n            timer = setTimeout(showTarget, delay);\r\n        }\r\n\r\n        function showTarget() {\r\n            state = 'target'; screen.className = 'target';\r\n            msg.style.display = 'none'; startTime = performance.now();\r\n            playSound(880, 0.1);\r\n        }\r\n\r\n        function finishTest() {\r\n            const reactionTime = ((performance.now() - startTime) / 1000).toFixed(3);\r\n            state = 'result'; screen.className = 'waiting';\r\n            result.style.display = 'block'; msg.style.display = 'block';\r\n            msg.innerText = '반응 속도'; result.innerText = reactionTime + 's';\r\n            \r\n            checkNewRecord(parseFloat(reactionTime));\r\n            updateSessionList(parseFloat(reactionTime));\r\n        }\r\n\r\n        function checkNewRecord(time) {\r\n            const savedBest = localStorage.getItem('master_best_time');\r\n            \r\n            // 신기록 달성 시\r\n            if (!savedBest || time \u003c parseFloat(savedBest)) {\r\n                localStorage.setItem('master_best_time', time);\r\n                // 이름이 없으면 기본값 설정\r\n                if (!localStorage.getItem('master_best_name')) {\r\n                    localStorage.setItem('master_best_name', \"무명고수\");\r\n                }\r\n                loadBestRecord();\r\n                playSound(1500, 0.5, 0.2);\r\n                \r\n                // 안내 멘트 살짝 변경\r\n                msg.innerText = \" 신기록\";\r\n            } else {\r\n                playSound(1200, 0.2);\r\n            }\r\n        }\r\n\r\n        function editBestName(e) {\r\n            e.stopPropagation(); // 배경 클릭 이벤트 전파 방지\r\n            const time = localStorage.getItem('master_best_time');\r\n            if (!time) {\r\n                alert(\"아직 기록이 없습니다. 먼저 훈련을 시작하세요!\");\r\n                return;\r\n            }\r\n\r\n            const currentName = localStorage.getItem('master_best_name') || \"무명고수\";\r\n            const newName = prompt(`현재 기록(${time}s)의 주인공 이름을 입력하세요:`, currentName);\r\n            \r\n            if (newName !== null && newName.trim() !== \"\") {\r\n                localStorage.setItem('master_best_name', newName.trim());\r\n                loadBestRecord();\r\n            }\r\n        }\r\n\r\n        function loadBestRecord() {\r\n            const time = localStorage.getItem('master_best_time');\r\n            const name = localStorage.getItem('master_best_name');\r\n            if (time) {\r\n                bestInfo.innerText = `${name || \"무명고수\"} : ${time}s`;\r\n            } else {\r\n                bestInfo.innerText = \"기록 없음\";\r\n            }\r\n        }\r\n\r\n        function updateSessionList(time) {\r\n            sessionRecords.push(time);\r\n            sessionRecords.sort((a, b) => a - b);\r\n            const displayRecords = sessionRecords.slice(0, 5);\r\n            recordList.innerHTML = displayRecords.map((r, i) => \r\n                `\u003cli>\u003cspan>${i + 1}위\u003c/span> \u003cspan>${r.toFixed(3)}s\u003c/span>\u003c/li>`\r\n            ).join('');\r\n        }\r\n\r\n        function tooFast() {\r\n            clearTimeout(timer); state = 'result'; screen.className = 'too-fast';\r\n            msg.innerText = '부정출발! 다시 하세요.'; result.style.display = 'none';\r\n            playSound(200, 0.5);\r\n        }\r\n\r\n        function clearAllData(e) {\r\n            e.stopPropagation();\r\n            if (confirm(\"역대 최고 기록을 포함한 모든 데이터를 삭제할까요?\")) {\r\n                localStorage.removeItem('master_best_time'); localStorage.removeItem('master_best_name');\r\n                sessionRecords = [];\r\n                recordList.innerHTML = '\u003cli>-\u003c/li>';\r\n                loadBestRecord();\r\n                state = 'waiting'; screen.className = 'waiting';\r\n                msg.innerText = '화면을 터치하여 시작'; result.style.display = 'none';\r\n            }\r\n        }\r\n\r\n        function toggleFullScreen(e) {\r\n            e.stopPropagation();\r\n            if (!document.fullscreenElement) document.documentElement.requestFullscreen();\r\n            else document.exitFullscreen();\r\n        }\r\n    \u003c/script>\r\n\u003c/body>\r\n\u003c/html>"},{"name":"오늘의 뽑기","html":"\u003c!doctype html>\n\u003chtml lang=\"ko\">\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>오늘의 뽑기\u003c/title>\n\u003cstyle>\n:root{font-family:Arial,'Malgun Gothic',sans-serif;color:#243445;background:#f5f4ef}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #d8dfdf;border-radius:12px;background:white;color:#243445;padding:12px 17px}button:hover{background:#edf3f0}button:disabled{opacity:.45;cursor:default}.primary{background:#247969;color:white;border:0}.primary:hover{background:#1c6558}header{max-width:1120px;margin:auto;padding:28px 24px;display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;margin:0}small,.muted{color:#6b7c85}main{max-width:1120px;margin:auto;padding:12px 24px 40px}.tabs{display:flex;gap:8px;margin-bottom:24px}.tabs button.active{background:#243445;color:white}.grid{display:grid;grid-template-columns:1fr 1.15fr;gap:24px}.card{background:#fff;border:1px solid #e4e7e3;border-radius:22px;padding:26px}h2{font-size:20px;margin:0 0 16px}h3{font-size:16px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}input,select,textarea{border:1px solid #d6dfdb;border-radius:10px;padding:11px;background:#fff;color:#243445;max-width:100%}textarea{font:inherit;width:100%;resize:vertical}input[type=number]{width:78px}input[type=checkbox]{accent-color:#247969;width:18px;height:18px}#name{flex:1;min-width:130px}.items{max-height:400px;overflow:auto;margin:16px 0}.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #edf0ed}.item .label{flex:1;overflow-wrap:anywhere}.item button{padding:7px 10px}.badge{background:#edf4ef;color:#247969;border-radius:20px;padding:6px 12px;font-size:13px}.foot{margin-top:20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.stage{text-align:center}.stagehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.wheelbox{position:relative;width:min(64vh,480px,90vw);margin:15px auto}.pointer{position:absolute;z-index:2;top:-8px;left:calc(50% - 16px);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent; argin:17px 0}.coin-slot{position:relative;width:46px;height:62px}.slot{display:block;width:11px;height:35px;border:4px solid #84928d;border-radius:5px;background:#283f38;margin:0 auto}.coin-slot small{font-size:9px;letter-spacing:2px}.coin{position:absolute;top:-28px;left:9px;width:28px;height:28px;line-height:24px;border:3px solid #d5a94d;background:#f5d782;color:#a1782b;border-radius:50%;opacity:0}.knob{width:68px;height:68px;background:#28796c;border-radius:50%;border:5px solid #b9d3ca;box-shadow:0 3px 0 #1c5147;display:grid;place-items:center}.knob span{height:18px;width:54px;background:#f5f2e9;border-radius:9px;box-shadow:0 3px 2px #0002;transform:rotate(-35deg)}.chute{position:relative;height:77px;width:140px;background:#354c44;border:7px solid #ddd4c4;border-radius:35px 35px 18px 18px;margin:auto;box-shadow:inset 0 12px 10px #0004}.prize{position:absolute;width:57px;height:57px;left:35px;top:5px;opacity:0}.half{position:absolute;width:57px;height:29px;background:#e5ad67;border:2px solid #fff8}.top-half{border-radius:40px 40px 0 0;top:0}.bottom-half{border-radius:0 0 40px 40px;top:28px;background:#fff4db}.spark{position:absolute;left:18px;top:15px;color:#f5d265;font-size:28px;opacity:0}.feet{height:10px;background:#28796c;margin:0 36px;border-radius:0 0 12px 12px}.mixing .capsule{animation:tumble .48s ease-in-out infinite alternate;animation-delay:var(--delay)}.mixing .knob span{animation:turn 1.87s ease-in-out forwards}.mixing .coin{animation:insert 1.7s ease-in forwards}.dispensing .prize{animation:drop .65s cubic-bezier(.3,.1,.5,1.3) forwards}.opened .prize{opacity:1}.opened .top-half{transform:translate(-12px,-20px) rotate(-25deg);transition:transform .85s}.opened .bottom-half{transform:translate(9px,8px) rotate(12deg);transition:transform .85s}.opened .spark{opacity:1;transition:opacity .85s}.stage #result{font-size:clamp(30px,6vw,68px);overflow-wrap:anywhere;line-height:1.25;max-width:950px;margin:20px auto;min-height:85px}.stage #spin{padding:16px 38px} 003cdiv class=\"coin-slot\">\u003cspan class=\"coin\">★\u003c/span>\u003cspan class=\"slot\">\u003c/span>\u003csmall>COIN\u003c/small>\u003c/div>\u003cdiv class=\"knob\">\u003cspan>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"chute\">\u003cdiv id=\"prize\" class=\"prize\">\u003cdiv class=\"half top-half\">\u003c/div>\u003cdiv class=\"half bottom-half\">\u003c/div>\u003cspan class=\"spark\">✦\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"feet\">\u003c/div>\u003c/div>\u003cdiv id=\"result\" role=\"status\" aria-live=\"polite\">어떤 결과가 나올까요?\u003c/div>\u003cbutton id=\"spin\" class=\"primary\">동전 넣고 뽑기\u003c/button>\u003cp id=\"remaining\" class=\"muted\">\u003c/p>\u003cdiv id=\"history\" class=\"history\">\u003c/div>\u003c/main>\u003c/div>\u003c/div>\u003cdiv id=\"toast\" role=\"status\" class=\"hidden\">\u003c/div>\n\u003cdialog id=\"resultPopup\" class=\"result-popup\" aria-labelledby=\"popupResult\" aria-describedby=\"popupLabel\">\u003cdiv class=\"popup-star\" aria-hidden=\"true\">\u003c/div>\u003cp id=\"popupLabel\" class=\"popup-label\">오늘의 당첨 결과\u003c/p>\u003cdiv id=\"popupResult\">\u003c/div>\u003cbutton id=\"popupClose\" class=\"primary\" autofocus>다음 뽑기 준비\u003c/button>\u003c/dialog>\u003cstyle>\n:root{color-scheme:dark;--board:#171a16;--surface:#24281f;--edge:#454b3d;--ink:#f5f7eb;--quiet:#c8cfbe;--mint:#d6f570;--amber:#ffba78}\nhtml,body{background:var(--board)!important;color:var(--ink)!important}\nbody,button,input,select,textarea{font-family:system-ui,\"Malgun Gothic\",sans-serif!important}\nh1,h2,h3{letter-spacing:-.04em}h1,h2,h3,strong{color:inherit}\nbutton{border-radius:10px!important;background:var(--surface)!important;border:1px solid var(--edge)!important;color:var(--ink)!important;box-shadow:none!important;text-shadow:none!important;font-weight:700!important}\nbutton:hover:not(:disabled){border-color:var(--mint)!important}\nbutton:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--mint);outline-offset:3px}\nbutton:disabled{opacity:.46}\ninput:not([type=checkbox]):not([type=radio]),select,textarea{background:#1d211a!important;border:1px solid var(--edge)!important;color:var(--ink)!important;border-radius:8px!important}\ninput::placeholder,textarea::placeholder{color:var(--quiet)!important}\ninput[type=checkbox],input[type=radio],progress{accent-color:var(--mint)}\n.primary,.start-btn,.start-big-btn,#toggle,#start,#draw,button.active,button[aria-pressed=true]{background:var(--mint)!important;color:#1e2811!important;border-color:var(--mint)!important}\n#timer,#time-display,#result,.solo-time,.duo-time,.relay-current-time,.result-time,#best-record-info{font-variant-numeric:tabular-nums;letter-spacing:-.055em;text-shadow:none!important}\n@keyframes board-reveal{from{opacity:.65;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}\n@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}\n#fitViewport,#fitContent,.stage,#fitContent header{background:var(--board)!important;color:var(--ink)!important}.panel,.card,.item,.result-popup,.more-tools,.stagehead,.tabs{background:var(--surface)!important;color:var(--ink)!important;border-color:var(--edge)!important;box-shadow:none!important}.label,#popupResult,#result,.badge{color:var(--ink)!important}.result-popup[open]{animation:board-reveal .25s ease both}.popup-star,header h1 span{display:none!important}#spin{background:var(--mint)!important;color:#1e2811!important}.machine-top{background:var(--mint)!important;color:#1e2811!important;border-color:var(--edge)!important}.base{background:#333b29!important;border-color:var(--edge)!important;box-shadow:none!important}.globe{border-color:#677751!important}.brand{text-shadow:none!important}.chute{border-color:#677751!important;box-shadow:none!important}.stagehead .badge{background:var(--board)!important}.more-tools summary{border-color:var(--edge)!important}#fitContent header{border-bottom:0!important;box-shadow:none!important}#fitContent h1::after{content:none!important}html,body{height:auto;min-height:100%;overflow:auto}#fitContent #stage{height:auto;min-height:0;overflow:visible;row-gap:10px;grid-template-rows:auto minmax(0,1fr) auto auto auto minmax(0,1fr);padding-bottom:24px}#fitContent .stagehead{flex-wrap:wrap}#fitContent .machine{zoom:1;transform:none;margin:12px auto 16px}#fitContent .stage #result::before{content:none}#fitContent .stage #remaining{color:var(--quiet)}@media(min-width:901px) and (max-height:730px){#fitContent .machine{zoom:.84}}@media(max-width:900px){#fitContent .machine{zoom:.9}}#fitContent .tabs{background:transparent!important}.result-popup{border-width:1px!important;border-radius:14px!important}\u003c/style>\u003cscript>\n'use strict';\nconst $=id=>document.getElementById(id),KEY='today-capsule-arcade-concept-v1',titles={game:'게임 모드',poomsae:'품새 모드',free:'자유 추첨'},colors=['#ff243e','#ff8a00','#ffdb00','#1565ff','#00bc69','#853afa','#ff26a8','#00b9e6'];\nconst defaults=()=>({mode:'game',lists:{game:[],poomsae:Array.from({length:8},(_,i)=>({name:`태극 ${i+1}장`,count:1,on:true})),free:[]},saved:[]});\nfunction validItems(a){return Array.isArray(a)&&a.length\u003c=20&&a.every(x=>x&&typeof x.name==='string'&&x.name.trim().length>0&&x.name.length\u003c=60&&Number.isInteger(x.count)&&x.count>=1&&x.count\u003c=999&&typeof x.on==='boolean')}\nfunction validState(s){return s&&titles[s.mode]&&s.lists&&Object.keys(titles).every(k=>validItems(s.lists[k]))&&Array.isArray(s.saved)&&s.saved.length\u003c=100&&s.saved.every(x=>x&&titles[x.mode]&&typeof x.name==='string'&&x.name.length\u003c=60&&validItems(x.items))}\nlet state=defaults(),excluded=new Set(),history=[],busy=false,rotation=0,pool=[],wheelSegments=[],timer;\ntry{const s=JSON.parse(localStorage.getItem(KEY));if(validState(s))state=s}catch{}\nfunction toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');clearTimeout(timer);timer=setTimeout(()=>$('toast').classList.add('hidden'),3000)}\nfunction persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{toast('저장 공간을 사용할 수 없어요. 백업으로 보관해주세요.')}}\nfunction items(){return state.lists[state.mode]}\nfunction render(){const scroll=$('items').scrollTop;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===state.mode));$('items').replaceChildren();items().forEach((x,i)=>{const row=document.createElement('div');row.className='item';const c=document.createElement('input');c.type='checkbox';c.checked=x.on;c.setAttribute('aria-label',x.name+' 추첨에 포함');c.onchange=()=>{x.on=c.checked;persist();render()};const n=document.createElement('span');n.className='label';n.textContent=x.name;const q=document.createElement('input');q.type='number';q.min=1;q.max=999;q.value=x.count;q.setAttribute('aria-label',x.name+' 추첨권 수');q.onchange=()=>{x.count=Math.max(1,Math.min(999,Math.floor(Number(q.value)||1)));persist();render()};const d=document.createElement('button');d.className='delete-item';d.title=x.name+' 삭제';d.setAttribute('aria-label',x.name+' 삭제');d.innerHTML='\u003csvg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003cpath d=\"M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7\"/>\u003c/svg>';d.onclick=()=>{items().splice(i,1);persist();render()};row.append(c,n,quantityControl(q,x.name),d);$('items').append(row)});$('items').scrollTop=scroll;const a=items().filter(x=>x.on);$('stats').textContent=`${a.length}종류 · ${a.reduce((s,x)=>s+x.count,0)}장`;$('empty').classList.toggle('hidden',items().length>0);$('start').disabled=!a.length;$('saved').replaceChildren();const placeholder=new Option('저장된 목록 선택','');$('saved').add(placeholder);state.saved.forEach((x,i)=>{if(x.mode===state.mode)$('saved').add(new Option(x.name,String(i)))});}\nfunction quantityControl(input,label){const box=document.createElement('div');box.className='quantity';for(const [text,delta] of [['−',-1],['+',1]]){const b=document.createElement('button');b.type='button';b.textContent=text;b.setAttribute('aria-label',label+(delta\u003c0?' 수량 줄이기':' 수량 늘리기'));b.onclick=()=>{input.value=Math.max(1,Math.min(999,(Number(input.value)||1)+delta));input.onchange()};box.append(b);if(delta\u003c0)box.append(input)}return box}\nconst initialCount=$('count');initialCount.onchange=()=>{initialCount.value=Math.max(1,Math.min(999,Math.floor(Number(initialCount.value)||1)))};\nif(initialCount.parentNode){const anchor=document.createElement('span');initialCount.replaceWith(anchor);anchor.replaceWith(quantityControl(initialCount,'추가할 항목'))}\nfunction addNames(names){const count=Math.max(1,Math.min(999,Math.floor(Number($('count').value)||1)));let skipped=0;for(const raw of names){const name=raw.trim().slice(0,60);if(!name)continue;const x=items().find(x=>x.name===name);if(x){x.count=Math.min(999,x.count+count);x.on=true}else if(items().length\u003c20)items().push({name,count,on:true});else skipped++}persist();render();if(skipped)toast('최대 20종류까지 넣을 수 있어요. 초과 항목은 추가하지 않았어요.')}\n$('add').onsubmit=e=>{e.preventDefault();addNames([$ ('name').value]);$('name').value='';$('name').focus()};$('bulkAdd').onclick=()=>{addNames($('bulk').value.split(/\\r?\\n/));$('bulk').value=''};\ndocument.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;persist();render()});\n$('all').onclick=()=>{items().forEach(x=>x.on=true);persist();render()};$('none').onclick=()=>{items().forEach(x=>x.on=false);persist();render()};$('clear').onclick=()=>{if(confirm('현재 모드의 입력 목록을 비울까요? 저장된 목록은 유지돼요.')){state.lists[state.mode]=[];persist();render()}};\n$('save').onclick=()=>{const name=$('listName').value.trim();if(!name||!items().length)return toast('항목과 저장할 목록 이름을 입력하세요.');const old=state.saved.find(x=>x.mode===state.mode&&x.name===name);if(old){if(!confirm('같은 이름의 저장 목록을 덮어쓸까요?'))return;old.items=structuredClone(items())}else{if(state.saved.length>=100)return toast('저장 목록은 최대 argin-top:7px}#adminView .status{font-size:14px;color:var(--muted)}#adminView .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}#adminView .card{\n    background:rgba(13,27,45,.92);border:1px solid var(--line);\n    border-radius:18px;padding:20px;box-shadow:0 14px 35px rgba(0,0,0,.2)\n  }#adminView .card.full{grid-column:1/-1}#adminView .card h2{font-size:18px;margin:0 0 15px;color:#fff}#adminView label{display:block;font-size:13px;color:var(--muted);font-weight:700;margin:14px 0 7px}#adminView input,#adminView textarea{\n    width:100%;border:1px solid #314965;border-radius:11px;background:#081522;\n    color:#fff;padding:12px 13px;font-size:16px;outline:none\n  }#adminView input:focus,#adminView textarea:focus{border-color:var(--gold)}#adminView textarea{min-height:145px;resize:vertical;line-height:1.55}#adminView .hint{font-size:12px;color:#7f94ad;margin-top:7px}#adminView .actions{\n    position:sticky;bottom:0;margin-top:22px;padding:14px;\n    display:flex;gap:10px;flex-wrap:wrap;background:rgba(4,11,20,.94);\n    border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(10px)\n  }#adminView button{\n    border:0;border-radius:11px;padding:13px 18px;font-size:15px;font-weight:800;\n    cursor:pointer\n  }#adminView .save{background:var(--gold);color:#171109}#adminView .open{background:var(--blue);color:white}#adminView .clear{background:#24364d;color:#dbe6f2;margin-left:auto}#adminView .msg{padding:12px 15px;border-radius:11px;margin-bottom:18px;display:none;font-weight:700}#adminView .msg.ok{display:block;background:rgba(70,211,154,.12);border:1px solid rgba(70,211,154,.4);color:#82e8bd}#adminView .msg.err{display:block;background:rgba(255,98,93,.12);border:1px solid rgba(255,98,93,.4);color:#ff9b98}\n  @media(max-width:760px){#adminView .grid{grid-template-columns:1fr}#adminView .card.full{grid-column:auto}#adminView .head{display:block}#adminView .status{margin-top:12px}#adminView .clear{margin-left:0}}\n\n[hidden]{display:none!important} #examView{display:contents} body.admin-mode{overflow:auto;height:auto;min-height:100dvh} #adminView{position:relative;z-index:3;width:100%} #adminView .wrap{color:#f5f7fb} #adminView .head{flex-wrap:wrap} .content-list{overflow:auto} .content-list li{overflow-wrap:anywhere;flex-shrink:0} .notice-bar{overflow-wrap:anywhere} button:focus-visible{outline:3px solid #fff;outline-offset:3px} @media(max-width:900px){.display-area.layout-4{grid-template-columns:1fr;grid-template-rows:auto}.grade-block{min-height:260px}.layout-1 .grade-badge{min-width:0}.layout-1 .grade-block{padding:24px}.content-list{overflow:visible}}\n@media(max-width:760px){#adminView .actions{position:static}} \u003c/style>\n\u003cstyle>\n:root{color-scheme:dark;--board:#171a16;--surface:#24281f;--edge:#454b3d;--ink:#f5f7eb;--quiet:#c8cfbe;--mint:#d6f570;--amber:#ffba78}\nhtml,body{background:var(--board)!important;color:var(--ink)!important}\nbody,button,input,select,textarea{font-family:system-ui,\"Malgun Gothic\",sans-serif!important}\nh1,h2,h3{letter-spacing:-.04em}h1,h2,h3,strong{color:inherit}\nbutton{border-radius:10px!important;background:var(--surface)!important;border:1px solid var(--edge)!important;color:var(--ink)!important;box-shadow:none!important;text-shadow:none!important;font-weight:700!important}\nbutton:hover:not(:disabled){border-color:var(--mint)!important}\nbutton:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--mint);outline-offset:3px}\nbutton:disabled{opacity:.46}\ninput:not([type=checkbox]):not([type=radio]),select,textarea{background:#1d211a!important;border:1px solid var(--edge)!important;color:var(--ink)!important;border-radius:8px!important}\ninput::placeholder,textarea::placeholder{color:var(--quiet)!important}\ninput[type=checkbox],input[type=radio],progress{accent-color:var(--mint)}\n.primary,.start-btn,.start-big-btn,#toggle,#start,#draw,button.active,button[aria-pressed=true]{background:var(--mint)!important;color:#1e2811!important;border-color:var(--mint)!important}\n#timer,#time-display,#result,.solo-time,.duo-time,.relay-current-time,.result-time,#best-record-info{font-variant-numeric:tabular-nums;letter-spacing:-.055em;text-shadow:none!important}\n@keyframes board-reveal{from{opacity:.65;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}\n@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}\n#examView,#adminView{--board:#161514;--surface:#25211b;--edge:#5a4b32;--mint:#eac369;color:var(--ink)!important;background:var(--board)!important}.top-bar,.controls,.footer-bar,.grade-block,.grade-header,#adminView .card,.ready-content,.date-box,.notice-bar{background:var(--surface)!important;color:var(--ink)!important;border-color:var(--edge)!important;box-shadow:none!important}.grade-title,.dojang,.ready-title,.content-list,.content-list li,.date-text,#adminView label{color:var(--ink)!important}.grade-badge{background:var(--mint)!important;color:#1e2811!important}.ready-kicker,.ready-line,.ready-sub,.ready-wait{display:none!important}#examView .ready-content{background:transparent!important;border:0!important;box-shadow:none!important}.ready-content .ready-msg{color:#f8f3e8}.ready-content .ready-title{text-shadow:0 4px 30px #0008}.ready-content .ready-title span{color:#eac369}.grade-badge{background:#eac369!important;color:#201809!important}#examView .top-bar{background:linear-gradient(106deg,#352a1a,#181716 52%,#2c2318)!important;border-bottom-color:#9d7841!important}\n#examView .emblem{background:linear-gradient(145deg,#3f311c,#171511);border-color:#d6ae61;box-shadow:0 0 18px #e6b76038;color:#f4d68a}\n#examView .emblem::before{content:\"武\";font-family:\"Batang\",serif;font-weight:700}\n#examView .date-box{background:#171511!important;border-color:#967442!important}\n#examView .empty-state{border-color:#977440;box-shadow:inset 0 0 70px #110e0b80;background-color:#1b1915}\n#examView .ready-content::after{content:\"\";display:block;width:min(45%,190px);height:1px;margin:clamp(12px,3vh,28px) auto 0;background:linear-gradient(90deg,transparent,#e2bc6d,transparent);box-shadow:0 0 12px #e2bc6d70}\n#examView .ready-title strong{color:#f4cf76;text-shadow:0 0 32px #e3b24e55}\n#examView .grade-block{background:radial-gradient(ellipse at 50% 0%,color-mix(in srgb,var(--accent) 17%,transparent),transparent 65%),linear-gradient(145deg,#28231d,#171614)!important;border-color:color-mix(in srgb,var(--accent) 46%,#352e24)!important;box-shadow:inset 0 1px 0 #ffffff12!important}\n#examView .grade-header{background:transparent!important;border-color:color-mix(in srgb,var(--accent) 40%,#352e24)!important}\n#examView .grade-badge{background:linear-gradient(150deg,#fff0bf,#c69a4e)!important;color:#21170a!important;text-shadow:none;box-shadow:0 0 18px color-mix(in srgb,var(--accent) 34%,transparent)}\u003c/style>\u003c/head>\n\u003cbody>\n\u003cdiv id=\"examView\">\n\n\u003cdiv class=\"top-bar\">\n  \u003cdiv class=\"brand-row\">\n    \u003cdiv class=\"emblem\">\u003c/div>\n    \u003cdiv>\n      \u003cdiv class=\"dojang\" id=\"dispDojang\">국가대표 마스터 태권도장\u003c/div>\n      \u003cdiv class=\"subtitle-text\" id=\"dispSubtitle\">\u003c/div>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"date-box\">\n    \u003cdiv class=\"date-label\">심사 날짜\u003c/div>\n    \u003cdiv class=\"date-text\" id=\"dispDate\">-\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"controls\">\n  \u003cbutton class=\"ctrl-btn-all\" id=\"adminButton\" onclick=\"openAdmin()\">관리자 설정\u003c/button>\u003cspan class=\"controls-label\">급수 선택\u003c/span>\n  \u003cbutton class=\"ctrl-btn\" id=\"btn-yugup\" onclick=\"toggle('yugup')\">유급자\u003c/button>\n  \u003cbutton class=\"ctrl-btn\" id=\"btn-pum1\" onclick=\"toggle('pum1')\">1품\u003c/button>\n  \u003cbutton class=\"ctrl-btn\" id=\"btn-pum2\" onclick=\"toggle('pum2')\">2품\u003c/button>\n  \u003cbutton class=\"ctrl-btn\" id=\"btn-pum3\" onclick=\"toggle('pum3')\">3품\u003c/button>\n  \u003cdiv class=\"ctrl-divider\">\u003c/div>\n  \u003cbutton class=\"ctrl-btn-all\" id=\"btn-all\" onclick=\"selectAll()\">전체 표시\u003c/button>\n  \u003cbutton class=\"ctrl-btn-none\" onclick=\"selectNone()\">선택 해제\u003c/button>\n  \u003cbutton class=\"ctrl-btn-none\" onclick=\"goFullscreen()\">전체화면\u003c/button>\n\u003c/div>\n\n\u003cdiv class=\"notice-bar\" id=\"noticeBar\">\u003c/div>\n\n\u003cdiv class=\"display-area layout-1\" id=\"displayArea\">\n  \u003cdiv class=\"grade-block yugup\" id=\"block-yugup\">\n    \u003cdiv class=\"grade-header\">\n      \u003cspan class=\"grade-badge badge-yugup\">유급자\u003c/span>\n      \u003cspan class=\"grade-title\">유급자 심사 내용\u003c/span>\n    \u003c/div>\n    \u003cul class=\"content-list\" id=\"list-yugup\">\u003c/ul>\n  \u003c/div>\n\n  \u003cdiv class=\"grade-block pum1\" id=\"block-pum1\">\n    \u003cdiv class=\"grade-header\">\n      \u003cspan class=\"grade-badge badge-1pum\">1품\u003c/span>\n      \u003cspan class=\"grade-title\">1품 심사 내용\u003c/span>\n    \u003c/div>\n    \u003cul class=\"content-list\" id=\"list-pum1\">\u003c/ul>\n  \u003c/div>\n\n  \u003cdiv class=\"grade-block pum2\" id=\"block-pum2\">\n    \u003cdiv class=\"grade-header\">\n      \u003cspan class=\"grade-badge badge-2pum\">2품\u003c/span>\n      \u003cspan class=\"grade-title\">2품 심사 내용\u003c/span>\n    \u003c/div>\n    \u003cul class=\"content-list\" id=\"list-pum2\">\u003c/ul>\n  \u003c/div>\n\n  \u003cdiv class=\"grade-block pum3\" id=\"block-pum3\">\n    \u003cdiv class=\"grade-header\">\n      \u003cspan class=\"grade-badge badge-3pum\">3품\u003c/span>\n      \u003cspan class=\"grade-title\">3품 심사 내용\u003c/span>\n    \u003c/div>\n    \u003cul class=\"content-list\" id=\"list-pum3\">\u003c/ul>\n  \u003c/div>\n\n  \u003cdiv class=\"empty-state\" id=\"emptyState\">\n    \u003cdiv class=\"ready-content\">\n      \u003cdiv class=\"ready-kicker\">\u003c/div>\n      \u003cdiv class=\"ready-sub\" id=\"readySubtitle\">승급심사\u003c/div>\n      \u003cdiv class=\"ready-title\">심사 \u003cstrong>준비중\u003c/strong>\u003c/div>\n      \u003cdiv class=\"ready-line\">\u003c/div>\n      \u003cdiv class=\"ready-msg\">잠시 후 시작됩니다\u003c/div>\n      \u003cdiv class=\"ready-wait\">예의 · 염치 · 인내 · 극기 · 백절불굴\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"footer-bar\">\u003c/div>\n\u003c/div>\n\u003csection id=\"adminView\" hidden aria-label=\"관리자 설정\">\n\u003cdiv class=\"wrap\">\n  \u003cdiv class=\"head\">\n    \u003cdiv>\n      \u003ch1>승급심사 관리자\u003c/h1>\n      \u003cdiv class=\"sub\">심사 화면에 표시할 내용을 여기서 수정합니다.\u003c/div>\n    \u003c/div>\n    \u003cbutton class=\"open\" onclick=\"closeAdmin()\">심사화면으로\u003c/button>\u003cdiv class=\"status\">저장 위치: 이 브라우저의 localStorage\u003c/div>\n  \u003c/div>\n\n  \u003cdiv id=\"message\" role=\"status\" aria-live=\"polite\" class=\"msg\">\u003c/div>\n\n  \u003cdiv class=\"grid\">\n    \u003csection class=\"card full\">\n      \u003ch2>기본 정보\u003c/h2>\n      \u003clabel for=\"dojangName\">도장명\u003c/label>\n      \u003cinput id=\"dojangName\" value=\"국가대표 마스터 태권도장\">\n\n      \u003clabel for=\"subtitle\">심사 제목\u003c/label>\n      \u003cinput id=\"subtitle\" value=\"승급심사\" placeholder=\"예: 2026년 8월 정기 승급심사\">\n\n      \u003clabel for=\"examDate\">심사 날짜\u003c/label>\n      \u003cinput id=\"examDate\" type=\"date\">\n\n      \u003clabel for=\"notice\">공지사항\u003c/label>\n      \u003cinput id=\"notice\" placeholder=\"비워두면 심사 화면에 표시되지 않습니다.\">\n    \u003c/section>\n\n    \u003csection class=\"card\">\n      \u003ch2>유급자 심사 내용\u003c/h2>\n      \u003ctextarea id=\"yugup\" placeholder=\"기본동작&#10;태극 1장&#10;앞차기 · 돌려차기&#10;겨루기\">\u003c/textarea>\n      \u003cdiv class=\"hint\">한 줄에 한 항목씩 입력하세요.\u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"card\">\n      \u003ch2>1품 심사 내용\u003c/h2>\n      \u003ctextarea id=\"pum1\" placeholder=\"태극 8장&#10;기본 발차기&#10;겨루기&#10;격파\">\u003c/textarea>\n      \u003cdiv class=\"hint\">한 줄에 한 항목씩 입력하세요.\u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"card\">\n      \u003ch2>2품 심사 내용\u003c/h2>\n      \u003ctextarea id=\"pum2\">\u003c/textarea>\n      \u003cdiv class=\"hint\">한 줄에 한 항목씩 입력하세요.\u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"card\">\n      \u003ch2>3품 심사 내용\u003c/h2>\n      \u003ctextarea id=\"pum3\">\u003c/textarea>\n      \u003cdiv class=\"hint\">한 줄에 한 항목씩 입력하세요.\u003c/div>\n    \u003c/section>\n  \u003c/div>\n\n  \u003cp class=\"hint\">기존 데이터는 같은 브라우저와 저장 영역에서 자동 복원됩니다. 파일 위치나 브라우저를 바꿀 때는 기존 파일에서 데이터를 백업하여 불러오세요. 저장 제한 시에도 백업을 사용할 수 있습니다.\u003c/p>\u003cinput type=\"file\" id=\"backupInput\" accept=\".json,application/json\" hidden onchange=\"importData(event)\">\u003cdiv class=\"actions\">\u003cbutton class=\"open\" onclick=\"exportData()\">저장 데이터 백업\u003c/button>\u003cbutton class=\"open\" onclick=\"document.getElementById('backupInput').click()\">백업 불러오기\u003c/button>\n    \u003cbutton class=\"save\" onclick=\"saveData()\">저장하기\u003c/button>\n    \u003cbutton class=\"open\" onclick=\"openExam()\">저장 후 심사화면으로\u003c/button>\n    \u003cbutton class=\"clear\" onclick=\"clearData()\">저장 내용 초기화\u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003c/section>\n\n\u003cscript>\n  const STORAGE_KEY = 'examData_v1';\n  const selected = { yugup: false, pum1: false, pum2: false, pum3: false };\n\n  function formatDate(dateStr) {\n    if (!dateStr || !/^\\d{4}-\\d{2}-\\d{2}$/.test(dateStr) || Number.isNaN(Date.parse(dateStr + 'T00:00:00'))) return '-';\n    const d = new Date(dateStr + 'T00:00:00');\n    const days = ['일','월','화','수','목','금','토'];\n    return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;\n  }\n\n  function textToList(text, id) {\n    const ul = document.getElementById(id);\n    ul.innerHTML = '';\n    if (!text) return;\n    text.split('\\n').filter(l => l.trim()).forEach(line => {\n      const li = document.createElement('li');\n      li.textContent = line.trim();\n      ul.appendChild(li);\n    });\n  }\n\n  function loadData() {\n    let data = arguments[0] || null;\n\n    // 1순위: URL 파라미터에서 데이터 읽기 (QR 스캔으로 접속한 경우)\n    const params = new URLSearchParams(window.location.search);\n    const encoded = params.get('d');\n    if (!data && encoded && !urlConsumed) {\n      try {\n        const json = decodeURIComponent(escape(atob(encoded)));\n        data = normalize(JSON.parse(json));\n        urlConsumed = true;\n      } catch(e) {\n        console.warn('QR 데이터 파싱 오류:', e);\n      }\n    }\n\n    // 2순위: localStorage에서 읽기 (같은 기기에서 접속한 경우)\n    if (!data) {\n      let raw; try { raw = localStorage.getItem(STORAGE_KEY); } catch(e) { storageIssue = '이 브라우저에서 저장소를 사용할 수 없습니다. 백업 파일로 보관하세요.'; }\n      if (raw) {\n        try { data = JSON.parse(raw); } catch(e) { storageIssue = '기존 저장 데이터 형식이 올바르지 않습니다. 백업을 불러오거나 내용을 새로 저장하세요.'; }\n      }\n    }\n\n    data = normalize(data);\n    currentData = data;\n    if (!data) {\n      document.getElementById('dispSubtitle').textContent = '승급심사';\n      document.getElementById('readySubtitle').textContent = '승급심사';\n      return;\n    }\n\n    const subtitle = data.subtitle || '승급심사';\n    document.getElementById('dispDojang').textContent = data.dojangName || '국가대표 마스터 태권도장';\n    document.getElementById('dispDate').textContent = formatDate(data.examDate);\n    document.getElementById('dispSubtitle').textContent = subtitle;\n    document.getElementById('readySubtitle').textContent = subtitle;\n    textToList(data.yugup, 'list-yugup');\n    textToList(data.pum1, 'list-pum1');\n    textToList(data.pum2, 'list-pum2');\n    textToList(data.pum3, 'list-pum3');\n    const notice = document.getElementById('noticeBar');\n    notice.classList.remove('visible');\n    if (data.notice && data.notice.trim()) {\n      notice.textContent = ' ' + data.notice;\n      notice.classList.add('visible');\n    }\n  }\n\n  function toggle(key) {\n    selected[key] = !selected[key];\n    render();\n  }\n\n  function selectAll() {\n    Object.keys(selected).forEach(k => selected[k] = true);\n    render();\n  }\n\n  function selectNone() {\n    Object.keys(selected).forEach(k => selected[k] = false);\n    render();\n  }\n\n  function goFullscreen() {\n    const el = document.documentElement;\n    if (document.fullscreenElement) { document.exitFullscreen().catch(()=>{}); return; }\n    try { const result = el.requestFullscreen ? el.requestFullscreen() : el.webkitRequestFullscreen ? el.webkitRequestFullscreen() : null; if(result && result.catch) result.catch(()=>alert('전체화면을 사용할 수 없습니다. 브라우저의 전체화면 기능을 이용해 주세요.')); } catch(e) { alert('전체화면을 사용할 수 없습니다.'); }\n  }\n\n  function render() {\n    const keys = ['yugup','pum1','pum2','pum3'];\n    const activeCount = keys.filter(k => selected[k]).length;\n\n    keys.forEach(k => {\n      const block = document.getElementById('block-' + k);\n      const btn = document.getElementById('btn-' + k);\n      if (selected[k]) {\n        block.classList.add('visible');\n        btn.classList.add('active');\n      } else {\n        block.classList.remove('visible');\n        btn.classList.remove('active');\n      }\n    });\n\n    const area = document.getElementById('displayArea');\n    const empty = document.getElementById('emptyState');\n    area.classList.remove('layout-1','layout-2','layout-3','layout-4');\n\n    if (activeCount === 0) {\n      empty.style.display = 'flex';\n      area.classList.add('layout-1');\n    } else {\n      empty.style.display = 'none';\n      area.classList.add('layout-' + activeCount);\n    }\n\n    const allBtn = document.getElementById('btn-all');\n    if (activeCount === 4) allBtn.classList.add('active');\n    else allBtn.classList.remove('active');\n  }\n\n\n  const fields=['dojangName','subtitle','examDate','notice','yugup','pum1','pum2','pum3'];\n  let currentData, urlConsumed=false, storageIssue='', dirty=false;\n  function normalize(value){ const d={dojangName:'국가대표 마스터 태권도장',subtitle:'승급심사',examDate:'',notice:'',yugup:'',pum1:'',pum2:'',pum3:''}; if(value && typeof value==='object' && !Array.isArray(value)) fields.forEach(k=>{if(typeof value[k]==='string')d[k]=value[k]}); return d; }\n  function fillForm(){fields.forEach(k=>document.getElementById(k).value=currentData[k]);dirty=false;}\n  function openAdmin(){fillForm();document.getElementById('examView').hidden=true;document.getElementById('adminView').hidden=false;document.body.classList.add('admin-mode');showMessage(storageIssue || '이 파일에서 저장하면 심사화면에 즉시 반영됩니다.',storageIssue?'err':'ok');document.getElementById('dojangName').focus();}\n  function closeAdmin(){if(dirty&&!confirm('저장하지 않은 변경사항을 버리고 심사화면으로 돌아갈까요?'))return;document.getElementById('adminView').hidden=true;document.getElementById('examView').hidden=false;document.body.classList.remove('admin-mode');document.getElementById('adminButton').focus();}\n  function showMessage(text,type='ok'){const el=document.getElementById('message');el.textContent=text;el.className='msg '+type;}\n  function getData(){const d={};fields.forEach(k=>d[k]=document.getElementById(k).value);return d;}\n  function saveData(){const d=getData();loadData(d);render();dirty=false;try{localStorage.setItem(STORAGE_KEY,JSON.stringify(d));showMessage('저장했습니다. 심사화면에 즉시 반영되었습니다.');return true;}catch(e){showMessage('화면에 반영했지만 브라우저에 저장하지 못했습니다. 백업 파일로 보관하세요.','err');return false;}}\n  function openExam(){if(saveData())closeAdmin();}\n  function clearData(){if(!confirm('저장된 심사 내용을 초기화할까요?'))return;try{localStorage.removeItem(STORAGE_KEY);}catch(e){showMessage('저장 내용을 삭제하지 못했습니다.','err');return;}loadData(normalize(null));fillForm();render();showMessage('저장 내용을 초기화했습니다.');}\n  function exportData(){const blob=new Blob([JSON.stringify(currentData,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='심사데이터.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}\n  async function importData(event){const file=event.target.files[0];if(!file)return;try{const d=JSON.parse(await file.text());if(!d||typeof d!=='object'||Array.isArray(d)||!fields.some(k=>typeof d[k]==='string'))throw Error();if(dirty&&!confirm('작성 중인 내용을 백업 데이터로 바꿀까요?'))return;currentData=normalize(d);fillForm();dirty=true;showMessage('백업을 불러왔습니다. 저장하기를 누르면 적용됩니다.');}catch(e){showMessage('올바른 심사 데이터 JSON 파일을 선택하세요.','err');}finally{event.target.value='';}}\n  document.getElementById('adminView').addEventListener('input',()=>dirty=true);\n  window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});\n\n  loadData();\n  render();\n\n  window.addEventListener('storage', (e) => {\n    if (e.key === STORAGE_KEY || e.key === null) { try { loadData(e.newValue ? normalize(JSON.parse(e.newValue)) : normalize(null)); } catch(err) { return; } if(!dirty)fillForm(); }\n  });\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}];
const home = document.getElementById('home');
const view = document.getElementById('board');
const frame = document.getElementById('tool');
const back = document.getElementById('back');
const expand = document.getElementById('expand');
let selected;
for (const button of document.querySelectorAll('[data-tool]')) {
  button.onclick = () => {
    if (selected === button) return;
    selected?.setAttribute('aria-pressed', 'false');
    selected = button;
    button.setAttribute('aria-pressed', 'true');
    const tool = tools[Number(button.dataset.tool)];
    document.getElementById('name').textContent = tool.name;
    frame.title = tool.name;
    frame.srcdoc = tool.html;
    home.hidden = true;
    frame.hidden = false;
  };
}
back.onclick = () => {
  frame.removeAttribute('srcdoc');
  frame.hidden = true;
  document.getElementById('name').textContent = '경기 보드';
  home.hidden = false;
  selected?.setAttribute('aria-pressed', 'false');
  selected?.focus();
  selected = undefined;
};
expand.onclick = async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await view.requestFullscreen();
  } catch {
    expand.textContent = '전체화면 사용 불가';
  }
};
document.addEventListener('fullscreenchange', () => {
  expand.textContent = document.fullscreenElement ? '전체화면 닫기' : '전체화면';
});
</script></html>
