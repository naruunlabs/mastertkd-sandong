<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>국가대표 마스터 태권도장</title>
<style>
:root{color-scheme:dark;--base:#171a16;--panel:#22261e;--line:#454b3d;--ink:#f5f7eb;--signal:#d6f570}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--base);color:var(--ink);font:16px system-ui,"Malgun Gothic",sans-serif}
#board{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--base)}
header{display:flex;align-items:center;gap:12px;padding:8px clamp(10px,3vw,28px);border-bottom:1px solid var(--line)}
#expand{margin-left:auto}#name{color:#c8cfbe;overflow-wrap:anywhere}
button{min-height:42px;font:inherit;color:inherit;cursor:pointer;background:transparent;border:1px solid var(--line);border-radius:5px;padding:7px 12px}
button:hover{border-color:var(--signal)}button:focus-visible{outline:2px solid var(--signal);outline-offset:-3px}
.stage{display:grid;min-height:0}
#home{display:grid;place-content:center;text-align:center;padding:20px;background:repeating-linear-gradient(90deg,var(--base) 0,var(--base) 59px,var(--panel) 60px)}
h1{font-size:clamp(2.5rem,9vw,7rem);letter-spacing:-.08em;margin:0;color:var(--signal);line-height:1.1}
iframe{display:block;width:100%;height:100%;border:0;background:var(--base)}
nav{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);padding:0 clamp(4px,2vw,24px)}
nav button{border:0;border-radius:0;border-bottom:3px solid transparent;font-size:clamp(.76rem,1.5vw,1rem);line-height:1.2;padding:9px 4px}
nav button[aria-pressed=true]{color:var(--signal);background:var(--panel);border-color:var(--signal)}
nav small{display:block;margin-bottom:4px;color:#c8cfbe;font-variant-numeric:tabular-nums}
@media(max-width:620px){nav{grid-template-columns:repeat(4,minmax(0,1fr))}nav button{padding:4px}nav small{margin-bottom:2px}header{font-size:.85rem}}
</style>
<div id="board">
<header><button id="back">홈</button><strong id="name">경기 보드</strong><button id="expand">전체화면</button></header>
<div class="stage"><main id="home"><h1>국가대표 마스터 태권도장</h1></main><iframe id="tool" hidden allowfullscreen title="수업 도구"></iframe></div>
<nav aria-label="수업 도구"><button type="button" data-tool="0" aria-pressed="false"><small>01</small>셔틀런</button><button type="button" data-tool="1" aria-pressed="false"><small>02</small>달리기 타이머</button><button type="button" data-tool="2" aria-pressed="false"><small>03</small>라운드 타이머</button><button type="button" data-tool="3" aria-pressed="false"><small>04</small>순발력 게임</button><button type="button" data-tool="4" aria-pressed="false"><small>05</small>순발력 측정기</button><button type="button" data-tool="5" aria-pressed="false"><small>06</small>오늘의 뽑기</button><button type="button" data-tool="6" aria-pressed="false"><small>07</small>승급심사</button></nav>
</div>
<script>
const tools = [{"name":"셔틀런","html":"\u003c!doctype html>\n\u003chtml lang=\"ko\">\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>10m 셔틀런\u003c/title>\n\u003cstyle>\n*{box-sizing:border-box}body{margin:0;background:#101828;color:#f8fafc;font:16px system-ui,sans-serif;min-height:100svh;display:grid;place-items:center;padding:20px}\nmain{width:min(100%,660px);text-align:center}h1{margin:.4rem 0 1.5rem;font-size:clamp(2rem,7vw,3.4rem)}.panel{background:#1c2940;border:1px solid #34445f;border-radius:24px;padding:clamp(18px,5vw,36px)}#status{color:#c6d3e5;min-height:1.5em}#timer{font-size:clamp(5rem,20vw,10rem);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.12;margin:.15em 0;color:#7df2c4}progress{width:100%;height:12px;accent-color:#7df2c4}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:22px;color:#c6d3e5}.stats strong{display:block;color:white;font-size:clamp(1.2rem,5vw,2rem);margin-top:4px}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:22px 0}button{border:0;border-radius:12px;padding:13px 22px;font:inherit;font-weight:750;color:white;background:#34445f;cursor:pointer}#toggle{background:#7df2c4;color:#10271f;min-width:120px}button:focus-visible{outline:3px solid white;outline-offset:3px}\nlabel{display:inline-flex;align-items:center;gap:10px;color:#c6d3e5}input{width:5em;padding:8px;border:1px solid #526482;border-radius:8px;background:#1c2940;color:white;font:inherit}\u003c/style>\n\u003cmain>\n\n\u003ch1>셔틀런 타이머\u003c/h1>\n\u003csection class=\"panel\" aria-label=\"셔틀런 진행 상황\">\n\u003cdiv id=\"status\" role=\"status\">준비\u003c/div>\n\u003cdiv id=\"timer\">6.0\u003c/div>\n\u003cprogress id=\"progress\" max=\"6\" value=\"0\" aria-label=\"구간 진행률\">\u003c/progress>\n\u003cdiv class=\"stats\">\n\u003cdiv>단계\u003cstrong id=\"level\">1 / 13\u003c/strong>\u003c/div>\n\u003cdiv>횟수\u003cstrong id=\"count\">0 / 100\u003c/strong>\u003c/div>\n\n\u003c/div>\n\u003c/section>\n\u003cdiv class=\"controls\">\u003clabel>시작 횟수 \u003cinput id=\"startCount\" type=\"number\" min=\"0\" max=\"99\" step=\"1\" value=\"0\">\u003c/label>\u003c/div>\u003cdiv class=\"controls\">\n\u003cbutton id=\"toggle\">시작\u003c/button>\u003cbutton id=\"reset\">초기화\u003c/button>\u003cbutton id=\"test\">소리 확인\u003c/button>\u003cbutton id=\"fullscreen\" type=\"button\" aria-pressed=\"false\">전체화면\u003c/button>\n\u003c/div>\n\n\u003c/main>\n\u003cstyle>\n:root{color-scheme:dark;--board:#171a16;--surface:#24281f;--edge:#454b3d;--ink:#f5f7eb;--quiet:#c8cfbe;--mint:#d6f570;--amber:#ffba78}\nhtml,body{background:var(--board)!important;color:var(--ink)!important}\nbody,button,input,select,textarea{font-family:system-ui,\"Malgun Gothic\",sans-serif!important}\nh1,h2,h3{letter-spacing:-.04em}h1,h2,h3,strong{color:inherit}\nbutton{border-radius:10px!important;background:var(--surface)!important;border:1px solid var(--edge)!important;color:var(--ink)!important;box-shadow:none!important;text-shadow:none!important;font-weight:700!important}\nbutton:hover:not(:disabled){border-color:var(--mint)!important}\nbutton:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--mint);outline-offset:3px}\nbutton:disabled{opacity:.46}\ninput:not([type=checkbox]):not([type=radio]),select,textarea{background:#1d211a!important;border:1px solid var(--edge)!important;color:var(--ink)!important;border-radius:8px!important}\ninput::placeholder,textarea::placeholder{color:var(--quiet)!important}\ninput[type=checkbox],input[type=radio],progress{accent-color:var(--mint)}\n.primary,.start-btn,.start-big-btn,#toggle,#start,#draw,button.active,button[aria-pressed=true]{background:var(--mint)!important;color:#1e2811!important;border-color:var(--mint)!important}\n#timer,#time-display,#result,.solo-time,.duo-time,.relay-current-time,.result-time,#best-record-info{font-variant-numeric:tabular-nums;letter-spacing:-.055em;text-shadow:none!important}\n@keyframes board-reveal{from{opacity:.65;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}\n@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}\n.panel{background:repeating-linear-gradient(90deg,var(--surface) 0,var(--surface) 59px,var(--board) 60px);border-color:var(--edge);border-radius:16px}#timer{color:var(--mint)}.panel.board-signal{outline:4px solid var(--mint);outline-offset:4px}.panel.board-end{outline-color:var(--amber)}main{width:min(100%,720px)}h1{font-size:clamp(1.6rem,4vw,2.6rem);margin:0 0 20px}.panel{padding:clamp(20px,4vw,40px)}.stats{border-top:1px solid var(--edge);padding-top:16px}.controls{margin:14px 0}\u003c/style>\u003cscript>\n'use strict';\nconst intervals = [6000, 5700, 5400, 5100, 4800, 4500, 4200, 3900, 3600, 3300, 3000, 2700, 2400];\nconst perLevel = 8;\nconst total = 100;\nconst elements = Object.fromEntries(\n  ['status','timer','progress','level','count','toggle','reset','test','startCount','fullscreen']\n    .map(id => [id, document.getElementById(id)])\n);\nlet audio, frame, deadline;\nlet state = 'ready', completed = 0, remaining = intervals[0];\nconst levelIndex = () => Math.min(intervals.length - 1, Math.floor(completed / perLevel));\nconst seconds = ms => (ms / 1000).toFixed(1);\n\nasync function enableSound() {\n  try {\n    const Audio = window.AudioContext || window.webkitAudioContext;\n    audio ??= new Audio();\n    await audio.resume();\n    return true;\n  } catch {\n    elements.status.textContent = '소리를 켤 수 없어요. 다른 브라우저에서 열어 주세요.';\n    return false;\n  }\n}\n\nfunction beep(frequency, duration) {\n  const panel = document.querySelector('.panel');\n  panel.classList.toggle('board-end', state === 'finished');\n  panel.classList.add('board-signal');\n  setTimeout(() => panel.classList.remove('board-signal'), 220);\n  const oscillator = audio.createOscillator();\n  const gain = audio.createGain();\n  const now = audio.currentTime;\n  oscillator.type = 'square';\n  oscillator.frequency.value = frequency;\n  gain.gain.setValueAtTime(0.001, now);\n  gain.gain.linearRampToValueAtTime(0.85, now + 0.008);\n  gain.gain.setValueAtTime(0.85, now + duration - 0.035);\n  gain.gain.exponentialRampToValueAtTime(0.001, now + duration);\n  oscillator.connect(gain);\n  gain.connect(audio.destination);\n  oscillator.start(now);\n  oscillator.stop(now + duration);\n}\n\nfunction draw() {\n  const pace = intervals[levelIndex()];\n  const duration = pace;\n  const display = state === 'ready' ? pace : remaining;\n  elements.timer.textContent = seconds(Math.ceil(display / 100) * 100);\n  elements.progress.max = duration;\n  elements.progress.value = state === 'ready' ? 0 : duration - remaining;\n  elements.level.textContent = (levelIndex() + 1) + ' / ' + intervals.length;\n  elements.count.textContent = completed + ' / ' + total;\n}\n\nfunction tick(now) {\n  remaining = Math.max(0, deadline - now);\n  if (remaining === 0) {\n    completed++;\n    if (completed === total) {\n      state = 'finished';\n    elements.startCount.disabled = false;\n      elements.status.textContent = '종료';\n      elements.toggle.textContent = '다시 시작';\n      beep(800, 0.65);\n      draw();\n      return;\n    }\n    const newLevel = completed % perLevel === 0;\n    beep(newLevel ? 1500 : 1150, newLevel ? 0.38 : 0.28);\n    remaining = intervals[levelIndex()];\n    deadline = now + remaining;\n  }\n  draw();\n  frame = requestAnimationFrame(tick);\n}\n\nfunction pause() {\n  cancelAnimationFrame(frame);\n  remaining = Math.max(0, deadline - performance.now());\n  state = 'paused';\n  elements.status.textContent = '일시정지';\n  elements.toggle.textContent = '계속';\n  draw();\n}\n\nfunction reset() {\n  cancelAnimationFrame(frame);\n  state = 'ready';\n  completed = Math.min(total - 1, Math.max(0, Math.trunc(Number(elements.startCount.value) || 0)));\n  remaining = intervals[levelIndex()];\n  elements.startCount.disabled = false;\n  elements.status.textContent = '준비';\n  elements.toggle.textContent = '시작';\n  draw();\n}\n\nelements.toggle.addEventListener('click', async () => {\n  if (state === 'active') {\n    pause();\n    return;\n  }\n  if (state === 'finished') reset();\n  if (!await enableSound() || state === 'active') return;\n  if (state === 'ready') {\n    reset();\n    elements.startCount.value = completed;\n    elements.startCount.disabled = true;\n    beep(1500, 0.38);\n  }\n  state = 'active';\n  elements.toggle.textContent = '일시정지';\n  elements.status.textContent = '진행 중';\n  deadline = performance.now() + remaining;\n  frame = requestAnimationFrame(tick);\n});\nelements.reset.addEventListener('click', reset);\nelements.startCount.addEventListener('input', reset);\nelements.test.addEventListener('click', async () => {\n  if (state !== 'active' && await enableSound() && state !== 'active') beep(1150, 0.28);\n});\nelements.fullscreen.addEventListener('click', async () => {\n  try {\n    if (document.fullscreenElement) {\n      await document.exitFullscreen();\n    } else {\n      await document.documentElement.requestFullscreen();\n    }\n  } catch {\n    elements.fullscreen.textContent = '전체화면 사용 불가';\n  }\n});\ndocument.addEventListener('fullscreenchange', () => {\n  const isFullscreen = Boolean(document.fullscreenElement);\n  elements.fullscreen.textContent = isFullscreen ? '전체화면 닫기' : '전체화면';\n  elements.fullscreen.setAttribute('aria-pressed', String(isFullscreen));\n});\ndocument.addEventListener('visibilitychange', () => {\n  if (document.hidden && state === 'active') pause();\n});\ndraw();\n\u003c/script>\n\u003c/html>\r\n\r\n\r\n\r\n\r\n"},{"name":"달리기 타이머","html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no\">\n\u003ctitle>달리기 타이머 - 국가대표마스터태권도장\u003c/title>\n\u003cstyle>\n@import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap');\n\n:root {\n  --bg: #0d0d0f;\n  --surface: #161618;\n  --surface2: #1e1e22;\n  --border: rgba(255,255,255,0.08);\n  --accent: #00e5ff;\n  --accent2: #ff3d6b;\n  --gold: #ffd700;\n  --green: #00e676;\n  --orange: #ff9100;\n  --text: #f0f0f0;\n  --text-dim: #888;\n}\n\n* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }\n.hidden { display: none !important; }\nbody, html { width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: 'Noto Sans KR', sans-serif; overflow: hidden; touch-action: manipulation; }\n\n#confetti-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; }\n\n.screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; transition: opacity 0.3s; }\n.screen.hidden { opacity: 0; pointer-events: none; }\n\n/* 메인 메뉴 */\n#menu-screen { background: var(--bg); gap: 24px; }\n.logo-area { text-align: center; margin-bottom: 10px; }\n.logo-area h1 { font-family: 'Black Han Sans', sans-serif; font-size: clamp(1.4rem, 4vw, 2rem); color: var(--accent); letter-spacing: 2px; }\n.logo-area p { color: var(--text-dim); font-size: 0.85rem; margin-top: 4px; }\n\n.mode-cards { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 680px; }\n.mode-card {\n  flex: 1; min-width: 160px; max-width: 200px;\n  background: var(--surface); border: 2px solid var(--border); border-radius: 24px;\n  padding: 28px 16px; text-align: center; position: relative; overflow: hidden;\n}\n.mode-card:active { transform: scale(0.95); }\n.mode-card .icon { font-size: 3rem; margin-bottom: 12px; }\n.mode-card h2 { font-family: 'Black Han Sans', sans-serif; font-size: 1.3rem; margin-bottom: 6px; }\n.mode-card p { font-size: 0.75rem; color: var(--text-dim); line-height: 1.5; }\n.mode-card.solo h2 { color: var(--accent); }\n.mode-card.duo h2 { color: var(--accent2); }\n.mode-card.relay h2 { color: var(--orange); }\n\n.record-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text-dim); padding: 10px 28px; border-radius: 50px; font-size: 0.85rem; }\n\n/* 닉네임 설정 */\n#nickname-screen { background: var(--bg); gap: 0; justify-content: flex-start; padding: 16px 20px; }\n#nickname-screen > h2 { font-family: 'Black Han Sans', sans-serif; font-size: 1.6rem; color: var(--accent); margin-bottom: 12px; flex-shrink: 0; }\n#nickname-container { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 480px; overflow-y: auto; flex: 1; min-height: 0; padding-right: 4px; }\n.nick-bottom { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 12px; width: 100%; max-width: 480px; }\n.nick-row { display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: 16px; padding: 14px 16px; border: 1px solid var(--border); }\n.nick-label { font-size: 1.8rem; min-width: 40px; text-align: center; }\n.nick-name { flex: 1; font-family: 'Black Han Sans', sans-serif; font-size: 1.4rem; color: var(--text); }\n.nick-reroll { background: var(--surface2); border: 1px solid var(--border); color: var(--text-dim); padding: 8px 14px; border-radius: 10px; font-size: 1rem; }\n.nick-reroll:active { transform: scale(0.9); color: var(--accent); }\n\n.relay-count-row { display: flex; align-items: center; gap: 16px; }\n.relay-count-row label { color: var(--text-dim); font-size: 0.9rem; }\n.count-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); font-size: 1.4rem; display: flex; align-items: center; justify-content: center; }\n#relay-count-display { font-family: 'Black Han Sans', sans-serif; font-size: 1.6rem; color: var(--orange); min-width: 36px; text-align: center; }\n\n.big-btn { padding: 18px 50px; font-family: 'Black Han Sans', sans-serif; font-size: 1.4rem; border: none; border-radius: 50px; transition: all 0.15s; }\n.big-btn:active { transform: scale(0.95); }\n.big-btn.primary { background: var(--accent); color: #000; }\n.big-btn.secondary { background: var(--surface2); color: var(--text-dim); font-size: 1rem; padding: 12px 30px; }\n\n/* 사이드바 기록판 */\n.sidebar { width: 200px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }\n.sidebar-title { font-family: 'Black Han Sans', sans-serif; font-size: 0.85rem; color: var(--text-dim); padding: 14px 14px 8px; border-bottom: 1px solid var(--border); flex-shrink: 0; letter-spacing: 1px; }\n.sidebar-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }\n.sidebar-item { background: var(--surface2); border-radius: 10px; padding: 8px 10px; border: 1px solid var(--border); }\n.sidebar-item.new-record { border-color: var(--gold); background: linear-gradient(135deg, rgba(255,215,0,0.08), var(--surface2)); }\n/* 새 기록 등장 애니메이션 */\n@keyframes dropIn {\n  0%   { opacity: 0; transform: translateY(-40px) scale(0.9); }\n  60%  { transform: translateY(4px) scale(1.03); }\n  100% { opacity: 1; transform: translateY(0) scale(1); }\n}\n@keyframes flashGold {\n  0%,100% { box-shadow: none; }\n  40%     { box-shadow: 0 0 16px rgba(255,215,0,0.7); }\n}\n.sidebar-item.animate-drop { animation: dropIn 0.4s cubic-bezier(0.22,1,0.36,1) both; }\n.sidebar-item.animate-flash { animation: flashGold 0.6s ease 0.35s both; }\n.sidebar-item.is-new { border-color: var(--accent); background: linear-gradient(135deg, rgba(0,229,255,0.1), var(--surface2)); }\n.sidebar-item .si-name { font-size: 0.8rem; color: var(--text-dim); display: flex; align-items: center; gap: 4px; }\n.sidebar-item .si-rank { font-family: 'Black Han Sans', sans-serif; font-size: 0.95rem; color: var(--text-dim); margin-bottom: 2px; }\n.sidebar-item .si-time { font-family: 'Black Han Sans', sans-serif; font-size: 1.1rem; color: var(--accent); margin-top: 2px; }\n.sidebar-item .si-best { font-size: 0.7rem; color: var(--gold); margin-top: 1px; }\n.sidebar-item .si-badge { font-size: 0.65rem; background: var(--gold); color: #000; padding: 1px 5px; border-radius: 8px; font-weight: 900; margin-left: 4px; }\n.sidebar-empty { color: var(--text-dim); font-size: 0.8rem; text-align: center; padding: 20px 10px; }\n.sidebar-more { color: var(--text-dim); font-size: 0.75rem; text-align: center; padding: 6px 0; opacity: 0.6; }\n.sidebar-item .si-rank-small { font-size: 0.72rem; color: var(--text-dim); margin-top: 2px; }\n\n/* 1인 모드 */\n#solo-screen { background: var(--bg); gap: 0; padding: 0; flex-direction: row; }\n.solo-main { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; transition: background 0.15s; gap: 10px; }\n.solo-main.state-idle { background: var(--bg); }\n.solo-main.state-running { background: #001a12; }\n.solo-main.state-done { background: #0a0a1a; }\n\n.solo-runner-name { font-family: 'Black Han Sans', sans-serif; font-size: clamp(2rem, 8vw, 3.5rem); }\n.solo-status { font-size: clamp(1rem, 3vw, 1.4rem); color: var(--text-dim); }\n.solo-time { font-family: 'Black Han Sans', sans-serif; font-size: clamp(5rem, 20vw, 10rem); line-height: 1; color: var(--green); text-shadow: 0 0 40px rgba(0,230,118,0.4); }\n.solo-time.stopped { color: var(--accent); text-shadow: 0 0 40px rgba(0,229,255,0.4); }\n.solo-hint { position: absolute; bottom: 80px; font-size: 1rem; color: var(--text-dim); }\n.solo-hint span { color: var(--accent); font-weight: bold; }\n.solo-again-btn { position: absolute; bottom: 30px; font-family: 'Black Han Sans', sans-serif; font-size: 1.2rem; padding: 14px 40px; background: var(--accent); color: #000; border: none; border-radius: 50px; box-shadow: 0 0 20px rgba(0,229,255,0.3); }\n.solo-again-btn:active { transform: scale(0.95); }\n\n.back-btn { position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-dim); padding: 10px 18px; border-radius: 10px; font-size: 0.9rem; z-index: 100; }\n\n/* 2인 모드 */\n#duo-screen { background: var(--bg); flex-direction: row; padding: 0; gap: 0; }\n#duo-inner { flex: 1; display: flex; flex-direction: row; height: 100%; position: relative; overflow: hidden; }\n.duo-half { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; transition: background 0.15s; gap: 10px; }\n.duo-half.left { border-right: 2px solid var(--border); }\n.duo-half.state-idle { background: var(--bg); }\n.duo-half.state-running { background: #001a08; }\n.duo-half.state-done { background: #0a0012; }\n.duo-half.state-done .duo-time { color: var(--accent2); text-shadow: 0 0 30px rgba(255,61,107,0.4); }\n\n.duo-finish-overlay { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 12px; z-index: 100; }\n.duo-finish-result { text-align: center; }\n.duo-winner-text { font-family: 'Black Han Sans', sans-serif; font-size: clamp(1.2rem, 4vw, 2rem); color: var(--gold); text-shadow: 0 0 20px rgba(255,215,0,0.5); }\n.duo-diff-text { font-size: 0.9rem; color: var(--text-dim); margin-top: 4px; }\n.duo-name { font-family: 'Black Han Sans', sans-serif; font-size: clamp(1.4rem, 5vw, 2.5rem); }\n.duo-status { font-size: clamp(0.75rem, 2.5vw, 1rem); color: var(--text-dim); text-align: center; }\n.duo-time { font-family: 'Black Han Sans', sans-serif; font-size: clamp(3rem, 12vw, 6rem); line-height: 1; color: var(--green); text-shadow: 0 0 30px rgba(0,230,118,0.3); }\n\n#duo-start-overlay {\n  position: absolute; top: 0; left: 0; width: 100%; height: 100%;\n  background: rgba(0,0,0,0.88); display: flex; flex-direction: column;\n  justify-content: center; align-items: center; z-index: 50; gap: 16px;\n}\n#duo-start-overlay h2 { font-family: 'Black Han Sans', sans-serif; font-size: clamp(1.4rem,5vw,2rem); color: var(--accent); text-align: center; }\n#duo-start-overlay p { color: var(--text-dim); font-size: 0.9rem; text-align: center; }\n.start-big-btn { font-family: 'Black Han Sans', sans-serif; font-size: 2rem; padding: 24px 60px; background: var(--green); color: #000; border: none; border-radius: 60px; box-shadow: 0 0 40px rgba(0,230,118,0.4); }\n.start-big-btn:active { transform: scale(0.95); }\n\n/* 릴레이 모드 */\n#relay-screen { background: var(--bg); gap: 0; padding: 0; flex-direction: row; }\n#relay-inner { flex: 1; display: flex; flex-direction: column; overflow: hidden; }\n.relay-top { width: 100%; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); flex-shrink: 0; }\n.relay-top h2 { font-family: 'Black Han Sans', sans-serif; font-size: 1.2rem; color: var(--orange); }\n.relay-total { font-family: 'Black Han Sans', sans-serif; font-size: 1.4rem; color: var(--gold); }\n\n.relay-main { flex: 1; width: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; transition: background 0.15s; gap: 8px; }\n.relay-main.state-idle { background: var(--bg); }\n.relay-main.state-running { background: #0d0800; }\n.relay-main.state-done { background: #000d0a; }\n\n.relay-current-name { font-family: 'Black Han Sans', sans-serif; font-size: clamp(2.5rem,10vw,5rem); }\n.relay-current-num { font-size: 1rem; color: var(--text-dim); }\n.relay-current-time { font-family: 'Black Han Sans', sans-serif; font-size: clamp(4rem,15vw,8rem); line-height: 1; color: var(--orange); text-shadow: 0 0 40px rgba(255,145,0,0.3); }\n.relay-hint { font-size: 0.95rem; color: var(--text-dim); margin-top: 8px; }\n.relay-hint span { color: var(--orange); font-weight: bold; }\n\n.relay-progress { width: 100%; padding: 12px 16px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; flex-shrink: 0; }\n.relay-pip { width: 36px; height: 36px; border-radius: 50%; background: var(--surface2); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 1rem; transition: all 0.3s; }\n.relay-pip.active { background: var(--orange); border-color: var(--orange); transform: scale(1.2); }\n.relay-pip.done { background: var(--green); border-color: var(--green); }\n\n/* 결과 화면 */\n#result-screen { background: var(--bg); gap: 0; flex-direction: row; align-items: stretch; padding: 0; }\n.result-left { flex: 1; overflow-y: auto; padding: 24px 16px 24px 24px; display: flex; flex-direction: column; gap: 8px; border-right: 1px solid var(--border); }\n.result-right { width: 220px; flex-shrink: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px; padding: 24px; }\n.result-left h2 { font-family: 'Black Han Sans', sans-serif; font-size: 1.6rem; margin-bottom: 8px; flex-shrink: 0; }\n.result-list { display: flex; flex-direction: column; gap: 8px; }\n.result-row { display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: 14px; padding: 12px 16px; border: 1px solid var(--border); animation: slideIn 0.3s ease both; }\n.result-row.rank1 { border-color: var(--gold); background: linear-gradient(135deg, rgba(255,215,0,0.12), var(--surface)); }\n.result-row.rank2 { border-color: #c0c0c0; }\n.result-row.rank3 { border-color: #cd7f32; }\n@keyframes slideIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }\n.result-rank { font-family: 'Black Han Sans', sans-serif; font-size: 1.6rem; min-width: 40px; text-align: center; }\n.result-emoji { font-size: 1.8rem; }\n.result-name { flex: 1; font-family: 'Black Han Sans', sans-serif; font-size: 1.2rem; }\n.result-time { font-family: 'Black Han Sans', sans-serif; font-size: 1.4rem; color: var(--accent); }\n.result-new { font-size: 0.7rem; background: var(--gold); color: #000; padding: 2px 8px; border-radius: 20px; font-weight: 900; }\n.best-record-box { text-align: center; color: var(--text-dim); font-size: 0.82rem; margin: -4px 0 6px; padding: 4px 0; }\n.best-record-box strong { color: var(--gold); }\n\n.relay-team-total { width: 100%; background: linear-gradient(135deg, rgba(255,145,0,0.15), var(--surface)); border: 2px solid var(--orange); border-radius: 16px; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }\n.relay-team-total span:first-child { font-family: 'Black Han Sans', sans-serif; font-size: 1.2rem; color: var(--orange); }\n.relay-team-total span:last-child { font-family: 'Black Han Sans', sans-serif; font-size: 2rem; color: var(--gold); }\n/* result-actions removed - using result-right */\n\n/* 기록 화면 */\n#records-screen { background: var(--bg); gap: 16px; overflow-y: auto; padding: 30px 20px; justify-content: flex-start; }\n#records-screen h2 { font-family: 'Black Han Sans', sans-serif; font-size: 1.8rem; color: var(--gold); }\n.rec-section { width: 100%; max-width: 600px; }\n.rec-section h3 { font-family: 'Black Han Sans', sans-serif; font-size: 1rem; color: var(--text-dim); margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }\n.rec-item { display: flex; justify-content: space-between; padding: 8px 12px; font-size: 0.9rem; border-bottom: 1px solid var(--border); }\n.rec-item .rec-name { color: var(--text); }\n.rec-item .rec-val { color: var(--accent); font-weight: bold; font-family: monospace; }\n.clear-btn { background: transparent; border: 1px solid var(--accent2); color: var(--accent2); padding: 8px 20px; border-radius: 20px; font-size: 0.85rem; }\n\n/* 팡파레 */\n#fanfare-overlay {\n  position: fixed; inset: 0; background: rgba(0,0,0,0.75);\n  display: flex; flex-direction: column; justify-content: center; align-items: center;\n  z-index: 9000; opacity: 0; pointer-events: none; transition: opacity 0.3s; gap: 16px;\n}\n#fanfare-overlay.show { opacity: 1; pointer-events: all; }\n#fanfare-title { font-family: 'Black Han Sans', sans-serif; font-size: clamp(2rem, 8vw, 4rem); color: var(--gold); animation: pulse 0.5s infinite alternate; }\n#fanfare-name { font-family: 'Black Han Sans', sans-serif; font-size: clamp(1.5rem, 6vw, 3rem); color: var(--text); }\n#fanfare-time { font-family: 'Black Han Sans', sans-serif; font-size: clamp(2.5rem, 10vw, 5rem); color: var(--accent); }\n#fanfare-close { background: var(--gold); color: #000; border: none; padding: 14px 40px; border-radius: 50px; font-family: 'Black Han Sans', sans-serif; font-size: 1.2rem; margin-top: 10px; }\n@keyframes pulse { from { text-shadow: 0 0 20px rgba(255,215,0,0.6); } to { text-shadow: 0 0 60px rgba(255,215,0,1); } }\n\u003c/style>\n\u003cstyle>\n:root{color-scheme:dark;--board:#171a16;--surface:#24281f;--edge:#454b3d;--ink:#f5f7eb;--quiet:#c8cfbe;--mint:#d6f570;--amber:#ffba78}\nhtml,body{background:var(--board)!important;color:var(--ink)!important}\nbody,button,input,select,textarea{font-family:system-ui,\"Malgun Gothic\",sans-serif!important}\nh1,h2,h3{letter-spacing:-.04em}h1,h2,h3,strong{color:inherit}\nbutton{border-radius:10px!important;background:var(--surface)!important;border:1px solid var(--edge)!important;color:var(--ink)!important;box-shadow:none!important;text-shadow:none!important;font-weight:700!important}\nbutton:hover:not(:disabled){border-color:var(--mint)!important}\nbutton:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--mint);outline-offset:3px}\nbutton:disabled{opacity:.46}\ninput:not([type=checkbox]):not([type=radio]),select,textarea{background:#1d211a!important;border:1px solid var(--edge)!important;color:var(--ink)!important;border-radius:8px!important}\ninput::placeholder,textarea::placeholder{color:var(--quiet)!important}\ninput[type=checkbox],input[type=radio],progress{accent-color:var(--mint)}\n.primary,.start-btn,.start-big-btn,#toggle,#start,#draw,button.active,button[aria-pressed=true]{background:var(--mint)!important;color:#1e2811!important;border-color:var(--mint)!important}\n#timer,#time-display,#result,.solo-time,.duo-time,.relay-current-time,.result-time,#best-record-info{font-variant-numeric:tabular-nums;letter-spacing:-.055em;text-shadow:none!important}\n@keyframes board-reveal{from{opacity:.65;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}\n@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}\n.screen,.sidebar,.duo-half,#duo-inner,#relay-inner,.result-left,.result-right{background:var(--board)!important;color:var(--ink)!important}.mode-card,.nick-row,.best-record-box,.result-row,.rec-item,.rec-section{background:var(--surface)!important;border:1px solid var(--edge)!important;color:var(--ink)!important;box-shadow:none!important}.mode-card:hover{border-color:var(--mint)!important}.solo-time,.duo-time,.relay-current-time,.result-time{color:var(--mint)!important}.result-row,.duo-finish-result{animation:board-reveal .25s ease both}.result-emoji,.mode-emoji,.logo-area,.relay-hint,.solo-hint{display:none!important}:root{--bg:var(--board);--card:var(--surface);--text:var(--ink);--text-dim:var(--quiet);--accent:var(--mint);--accent2:var(--mint);--green:var(--mint);--orange:var(--mint);--gold:var(--mint)}body *{font-family:inherit!important}.mode-cards{width:min(100%,780px);max-width:none;gap:12px}.mode-card{border-radius:12px;padding:24px 16px;min-height:110px;display:grid;place-content:center}.mode-card h2{color:var(--ink)!important;font-size:clamp(1.15rem,3vw,1.6rem);margin:0}.mode-card p,.mode-card .icon{display:none}.mode-card:hover h2{color:var(--mint)!important}.result-new{color:var(--mint)!important}#fanfare-title{animation:none}\u003c/style>\u003c/head>\n\u003cbody>\n\n\u003ccanvas id=\"confetti-canvas\">\u003c/canvas>\n\n\u003cdiv id=\"fanfare-overlay\">\n  \u003cdiv style=\"font-size:4rem\">\u003c/div>\n  \u003cdiv id=\"fanfare-title\">신기록!\u003c/div>\n  \u003cdiv id=\"fanfare-name\">\u003c/div>\n  \u003cdiv id=\"fanfare-time\">\u003c/div>\n  \u003cbutton id=\"fanfare-close\">확인\u003c/button>\n\u003c/div>\n\n\u003c!-- 메인 메뉴 -->\n\u003cdiv id=\"menu-screen\" class=\"screen\">\n  \u003cdiv class=\"logo-area\">\n    \u003ch1>국가대표마스터태권도장\u003c/h1>\n    \u003cp>달리기 타이머\u003c/p>\n  \u003c/div>\n  \u003cdiv class=\"mode-cards\">\n    \u003cdiv class=\"mode-card solo\" id=\"btn-solo\">\n      \u003cdiv class=\"icon\">\u003c/div>\n      \u003ch2>1인 모드\u003c/h2>\n      \u003cp>혼자 출발 터치 후\u003cbr>달리고 돌아와서 터치\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"mode-card duo\" id=\"btn-duo\">\n      \u003cdiv class=\"icon\">\u003c/div>\n      \u003ch2>2인 모드\u003c/h2>\n      \u003cp>선생님 출발 터치\u003cbr>좌/우 각자 터치\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"mode-card relay\" id=\"btn-relay\">\n      \u003cdiv class=\"icon\">\u003c/div>\n      \u003ch2>릴레이\u003c/h2>\n      \u003cp>차례로 이어달리기\u003cbr>개인 + 팀 기록\u003c/p>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv style=\"display:flex;gap:12px;flex-wrap:wrap;justify-content:center\">\n    \u003cbutton class=\"record-btn\" id=\"btn-records\"> 전체 기록 보기\u003c/button>\n    \u003cbutton class=\"record-btn\" id=\"btn-fullscreen\"> 전체 화면\u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- 닉네임 설정 -->\n\u003cdiv id=\"nickname-screen\" class=\"screen hidden\">\n  \u003ch2 id=\"nick-title\">선수 등록\u003c/h2>\n  \u003cdiv id=\"nickname-container\">\u003c/div>\n  \u003cdiv class=\"nick-bottom\">\n    \u003cdiv id=\"relay-count-row\" class=\"relay-count-row hidden\">\n      \u003clabel>릴레이 인원\u003c/label>\n      \u003cbutton class=\"count-btn\" id=\"relay-minus\">−\u003c/button>\n      \u003cspan id=\"relay-count-display\">4\u003c/span>\n      \u003cbutton class=\"count-btn\" id=\"relay-plus\">+\u003c/button>\n      \u003clabel>명\u003c/label>\n    \u003c/div>\n    \u003cbutton class=\"big-btn primary\" id=\"btn-start-mode\">시작!\u003c/button>\n    \u003cbutton class=\"big-btn secondary\" id=\"btn-nick-back\">← 돌아가기\u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- 1인 모드 -->\n\u003cdiv id=\"solo-screen\" class=\"screen hidden\">\n  \u003cdiv class=\"sidebar\">\n    \u003cdiv class=\"sidebar-title\"> 이번 세션 기록\u003c/div>\n    \u003cdiv class=\"sidebar-list\" id=\"solo-sidebar-list\">\u003cdiv class=\"sidebar-empty\">아직 기록 없음\u003c/div>\u003c/div>\n  \u003c/div>\n  \u003cbutton class=\"back-btn\" id=\"solo-back\">← 메뉴\u003c/button>\n  \u003cdiv class=\"solo-main state-idle\" id=\"solo-main\">\n    \u003cdiv class=\"solo-runner-name\" id=\"solo-name\">-\u003c/div>\n    \u003cdiv class=\"solo-status\" id=\"solo-status\">화면을 터치하면 출발!\u003c/div>\n    \u003cdiv class=\"solo-time\" id=\"solo-time\">00.000\u003c/div>\n    \u003cdiv class=\"solo-hint\" id=\"solo-hint\"> \u003cspan>터치\u003c/span>하여 출발\u003c/div>\n    \u003cbutton id=\"solo-again-btn\" class=\"solo-again-btn hidden\"> 다시 시작\u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- 2인 모드 -->\n\u003cdiv id=\"duo-screen\" class=\"screen hidden\">\n  \u003cdiv class=\"sidebar\">\n    \u003cdiv class=\"sidebar-title\"> 이번 세션 기록\u003c/div>\n    \u003cdiv class=\"sidebar-list\" id=\"duo-sidebar-list\">\u003cdiv class=\"sidebar-empty\">아직 기록 없음\u003c/div>\u003c/div>\n  \u003c/div>\n  \u003cdiv id=\"duo-inner\">\n    \u003cbutton class=\"back-btn\" id=\"duo-back\" style=\"z-index:200\">← 메뉴\u003c/button>\n    \u003cdiv id=\"duo-start-overlay\">\n      \u003ch2 id=\"duo-overlay-names\">-\u003c/h2>\n      \u003cp>선생님이 아래 버튼을 눌러\u003cbr>두 선수를 동시에 출발시킵니다\u003c/p>\n      \u003cbutton class=\"start-big-btn\" id=\"btn-duo-start\"> 출발!\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"duo-half left\" id=\"duo-left\">\n      \u003cdiv class=\"duo-name\" id=\"duo-name-0\">-\u003c/div>\n      \u003cdiv class=\"duo-status\" id=\"duo-status-0\">대기 중\u003c/div>\n      \u003cdiv class=\"duo-time\" id=\"duo-time-0\">00.000\u003c/div>\n      \u003cdiv id=\"duo-rank-0\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"duo-half right\" id=\"duo-right\">\n      \u003cdiv class=\"duo-name\" id=\"duo-name-1\">-\u003c/div>\n      \u003cdiv class=\"duo-status\" id=\"duo-status-1\">대기 중\u003c/div>\n      \u003cdiv class=\"duo-time\" id=\"duo-time-1\">00.000\u003c/div>\n      \u003cdiv id=\"duo-rank-1\">\u003c/div>\n    \u003c/div>\n    \u003cdiv id=\"duo-finish-overlay\" class=\"duo-finish-overlay hidden\">\n      \u003cdiv id=\"duo-finish-result\">\u003c/div>\n      \u003cbutton class=\"start-big-btn\" id=\"duo-again-btn\"> 다시 시작\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- 릴레이 모드 -->\n\u003cdiv id=\"relay-screen\" class=\"screen hidden\">\n  \u003cdiv class=\"sidebar\">\n    \u003cdiv class=\"sidebar-title\"> 이번 세션 기록\u003c/div>\n    \u003cdiv class=\"sidebar-list\" id=\"relay-sidebar-list\">\u003cdiv class=\"sidebar-empty\">아직 기록 없음\u003c/div>\u003c/div>\n  \u003c/div>\n  \u003cdiv id=\"relay-inner\">\n    \u003cdiv class=\"relay-top\">\n      \u003cbutton class=\"back-btn\" style=\"position:static\" id=\"relay-back\">← 메뉴\u003c/button>\n      \u003ch2 id=\"relay-title\">릴레이\u003c/h2>\n      \u003cdiv class=\"relay-total\" id=\"relay-total\">팀: --\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"relay-main state-idle\" id=\"relay-main\">\n      \u003cdiv class=\"relay-current-num\" id=\"relay-current-num\">1번 선수\u003c/div>\n      \u003cdiv class=\"relay-current-name\" id=\"relay-current-name\">-\u003c/div>\n      \u003cdiv class=\"relay-current-time\" id=\"relay-current-time\">00.000\u003c/div>\n      \u003cdiv class=\"relay-hint\" id=\"relay-hint\"> \u003cspan>터치\u003c/span>하여 출발\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"relay-progress\" id=\"relay-progress\">\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- 결과 화면 -->\n\u003cdiv id=\"result-screen\" class=\"screen hidden\">\n  \u003cdiv class=\"result-left\">\n    \u003ch2 id=\"result-title\">결과\u003c/h2>\n    \u003cdiv id=\"relay-team-box\" class=\"relay-team-total hidden\">\n      \u003cspan> 팀 합산\u003c/span>\n      \u003cspan id=\"relay-team-time\">--\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"result-list\" id=\"result-list\">\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"result-right\">\n    \u003cbutton class=\"big-btn primary\" id=\"btn-again\">한 번 더!\u003c/button>\n    \u003cbutton class=\"big-btn secondary\" id=\"btn-result-menu\">메뉴로\u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- 기록 화면 -->\n\u003cdiv id=\"records-screen\" class=\"screen hidden\">\n  \u003ch2> 전체 기록\u003c/h2>\n  \u003cdiv id=\"records-content\" style=\"width:100%;max-width:600px\">\u003c/div>\n  \u003cdiv style=\"display:flex;gap:10px;flex-wrap:wrap;justify-content:center\">\n    \u003cbutton class=\"clear-btn\" id=\"btn-clear\">기록 초기화\u003c/button>\n    \u003cbutton class=\"big-btn secondary\" id=\"btn-rec-menu\">← 메뉴\u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003cscript>\n// ── 닉네임 풀 ──\nconst NICKNAMES = [\n  '호랑이','사자','늑대','여우','곰','판다','독수리','돌고래',\n  '나비','용','유니콘','표범','상어','말','사슴','홍학',\n  '개구리','너구리','수달','악어',\n  '사과','오렌지','레몬','포도','딸기','복숭아','파인애플',\n  '키위','체리','블루베리','바나나','망고','메론','청사과'\n];\n\nfunction randomNick(exclude=[]) {\n  const pool = NICKNAMES.filter(n => !exclude.includes(n));\n  return pool[Math.floor(Math.random() * pool.length)];\n}\nfunction parseNick(s) {\n  const m = s.match(/^(\\p{Emoji_Presentation}|\\p{Emoji}\\uFE0F)/u);\n  const emoji = m ? m[0] : '';\n  const name = s.replace(emoji, '').trim();\n  return { emoji, name, full: s };\n}\n\n// ── 상태 ──\nlet currentMode = '';\nlet players = [];\nlet relayCount = 4;\nlet soloState = 'idle', soloStart = 0, soloTimer = null, soloPrevBest = null;\nlet duoState = [\"idle\",\"idle\"], duoStartTime = 0, duoTimes = [null,null], duoTimer = null;\nlet relayIdx = 0, relayState = 'idle', relayStart = 0, relayTimes = [], relayTimer = null, relayTotal = 0;\nlet resultMode = '';\nlet soloSession = [], duoSession = [], relaySession = [];\n\nfunction addSidebarItem(listId, emoji, name, timeMs, isNew) {\n  const list = document.getElementById(listId);\n  const empty = list.querySelector('.sidebar-empty');\n  if (empty) empty.remove();\n\n  if (listId === 'solo-sidebar-list') {\n    // 1인 모드: 이름 없이 순번 + 기록만\n    soloSession.push(timeMs);\n    // 기존 항목 순번 재정렬\n    rebuildSoloSidebar();\n  } else {\n    // duo/relay: 세션 배열에 push 후 정렬 재렌더\n    if (listId === 'duo-sidebar-list') {\n      duoSession.push({ emoji, name, t: timeMs, isNew });\n      rebuildDuoSidebar();\n    } else {\n      relaySession.push({ emoji, name, t: timeMs, isNew });\n      rebuildRelaySidebar();\n    }\n  }\n}\n\nfunction rebuildSoloSidebar(newTimeMs) {\n  const list = document.getElementById('solo-sidebar-list');\n  const n = soloSession.length;\n\n  // 시간순 정렬 → 등수 계산\n  const ranked = soloSession\n    .map((t, i) => ({ t, i }))\n    .sort((a, b) => a.t - b.t);\n  const rankOf = {}; // idx -> 등수\n  ranked.forEach((r, rank) => { rankOf[r.i] = rank + 1; });\n\n  // 새 기록의 등수\n  const newIdx = n - 1;\n  const newRank = rankOf[newIdx];\n\n  const best = getBest('solo', players[0]?.full || '');\n\n  // 1위부터 위에 표시 → 등수 오름차순으로 정렬해서 렌더\n  const sortedByRank = [...Array(n).keys()]\n    .map(i => ({ i, t: soloSession[i], rank: rankOf[i] }))\n    .sort((a, b) => a.rank - b.rank);\n\n  const top7 = sortedByRank.slice(0, 7);\n  const rest = sortedByRank.length - 7;\n  list.innerHTML = top7.map(({ i, t, rank }) => {\n    const isBest = best !== null && best === t;\n    const isNewest = i === newIdx;\n    const cls = [\n      'sidebar-item',\n      isBest ? 'new-record' : '',\n      isNewest ? 'animate-drop is-new' : '',\n    ].filter(Boolean).join(' ');\n    return `\u003cdiv class=\"${cls}\">\n      \u003cdiv class=\"si-rank\">${rank}위 ${isNewest ? '\u003cspan style=\"font-size:0.7rem;color:var(--accent)\"> 방금\u003c/span>' : ''}\u003c/div>\n      \u003cdiv class=\"si-time\">${fmt(t)}\u003c/div>\n      ${isBest ? '\u003cdiv class=\"si-best\"> 최고기록\u003c/div>' : ''}\n    \u003c/div>`;\n  }).join('') + (rest > 0 ? `\u003cdiv class=\"sidebar-more\">+${rest}개 더...\u003c/div>` : '');\n\n  // 새 항목이 화면 밖이면 스크롤\n  setTimeout(() => {\n    const items = list.querySelectorAll('.sidebar-item');\n    // newRank-1 번째 아이템으로 스크롤\n    if (items[newRank - 1]) {\n      items[newRank - 1].scrollIntoView({ behavior: 'smooth', block: 'nearest' });\n    }\n  }, 100);\n}\n\nfunction rebuildDuoSidebar() {\n  const list = document.getElementById('duo-sidebar-list');\n  const sorted = [...duoSession].sort((a, b) => a.t - b.t);\n  const top7 = sorted.slice(0, 7);\n  const rest = sorted.length - 7;\n  const newestT = duoSession[duoSession.length - 1]?.t;\n  list.innerHTML = top7.map(({ emoji, name, t, isNew }, rank) => {\n    const isNewest = t === newestT;\n    const cls = ['sidebar-item', isNew ? 'new-record' : '', isNewest ? 'animate-drop is-new' : ''].filter(Boolean).join(' ');\n    return `\u003cdiv class=\"${cls}\">\n      \u003cdiv class=\"si-name\">${emoji} ${name}${isNew ? '\u003cspan class=\"si-badge\">신기록\u003c/span>' : ''}\u003c/div>\n      \u003cdiv class=\"si-rank-small\">${rank + 1}위\u003c/div>\n      \u003cdiv class=\"si-time\">${fmt(t)}\u003c/div>\n    \u003c/div>`;\n  }).join('') + (rest > 0 ? `\u003cdiv class=\"sidebar-more\">+${rest}개 더...\u003c/div>` : '');\n}\n\nfunction rebuildRelaySidebar() {\n  const list = document.getElementById('relay-sidebar-list');\n  const sorted = [...relaySession].sort((a, b) => a.t - b.t);\n  const top7 = sorted.slice(0, 7);\n  const rest = sorted.length - 7;\n  const newestT = relaySession[relaySession.length - 1]?.t;\n  list.innerHTML = top7.map(({ emoji, name, t, isNew }, rank) => {\n    const isNewest = t === newestT;\n    const cls = ['sidebar-item', isNew ? 'new-record' : '', isNewest ? 'animate-drop is-new' : ''].filter(Boolean).join(' ');\n    return `\u003cdiv class=\"${cls}\">\n      \u003cdiv class=\"si-name\">${emoji} ${name}${isNew ? '\u003cspan class=\"si-badge\">신기록\u003c/span>' : ''}\u003c/div>\n      \u003cdiv class=\"si-rank-small\">${rank + 1}위\u003c/div>\n      \u003cdiv class=\"si-time\">${fmt(t)}\u003c/div>\n    \u003c/div>`;\n  }).join('') + (rest > 0 ? `\u003cdiv class=\"sidebar-more\">+${rest}개 더...\u003c/div>` : '');\n}\n\nfunction clearSidebar(listId) {\n  const el = document.getElementById(listId);\n  if (el) el.innerHTML = '\u003cdiv class=\"sidebar-empty\">아직 기록 없음\u003c/div>';\n}\n\n// ── 터치/클릭 이벤트 등록 (touchstart 우선) ──\nfunction tap(elId, fn) {\n  const el = document.getElementById(elId);\n  if (!el) return;\n  const isBtn = el.tagName === 'BUTTON' || el.tagName === 'A';\n  if (isBtn) {\n    // 버튼은 click만 (touchstart+preventDefault가 오히려 방해)\n    el.addEventListener('click', e => { e.stopPropagation(); fn(e); });\n  } else {\n    // 전체 화면 div는 touchstart 우선 (터치 지연 제거)\n    let fired = false;\n    el.addEventListener('touchstart', e => {\n      e.preventDefault();\n      if (fired) return; fired = true; setTimeout(()=>fired=false, 400);\n      fn(e);\n    }, { passive: false });\n    el.addEventListener('click', e => {\n      if (fired) return; fired = true; setTimeout(()=>fired=false, 400);\n      fn(e);\n    });\n  }\n}\n\n// ── 화면 전환 ──\nfunction showScreen(id) {\n  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));\n  document.getElementById(id).classList.remove('hidden');\n}\n\n// ── 메뉴 버튼 ──\ntap('btn-solo', () => goNickname('solo'));\ntap('btn-duo', () => goNickname('duo'));\ntap('btn-relay', () => goNickname('relay'));\ntap('btn-records', () => { renderRecordsScreen(); showScreen('records-screen'); });\ntap('btn-nick-back', () => showScreen('menu-screen'));\ntap('btn-start-mode', startMode);\ntap('relay-minus', () => changeRelayCount(-1));\ntap('relay-plus', () => changeRelayCount(1));\ntap('solo-back', () => showScreen('menu-screen'));\ntap('solo-again-btn', () => {\n  // 사이드바 유지하면서 타이머만 리셋\n  soloState = 'idle'; clearInterval(soloTimer);\n  document.getElementById('solo-time').innerText = '00.000';\n  document.getElementById('solo-time').className = 'solo-time';\n  document.getElementById('solo-main').className = 'solo-main state-idle';\n  document.getElementById('solo-status').innerText = '화면을 터치하면 출발!';\n  document.getElementById('solo-hint').classList.remove('hidden');\n  document.getElementById('solo-again-btn').classList.add('hidden');\n});\ntap('duo-back', () => showScreen('menu-screen'));\ntap('duo-again-btn', () => {\n  document.getElementById('duo-finish-overlay').classList.add('hidden');\n  // 사이드바 유지, 타이머만 리셋 후 출발 오버레이 다시 표시\n  duoState = ['idle','idle']; duoTimes = [null,null]; clearInterval(duoTimer);\n  players.forEach((p,i) => {\n    document.getElementById(`duo-time-${i}`).innerText = '00.000';\n    document.getElementById(`duo-time-${i}`).className = 'duo-time';\n    document.getElementById(`duo-status-${i}`).innerText = '대기 중';\n    document.getElementById(i===0?'duo-left':'duo-right').className = `duo-half ${i===0?'left':'right'} state-idle`;\n  });\n  document.getElementById('duo-start-overlay').style.display = 'flex';\n});\ntap('relay-back', () => showScreen('menu-screen'));\ntap('btn-duo-start', duoStart);\ntap('solo-main', soloTap);\ntap('duo-left', () => duoTap(0));\ntap('duo-right', () => duoTap(1));\ntap('relay-main', relayTap);\ntap('btn-again', playAgain);\ntap('btn-result-menu', () => showScreen('menu-screen'));\ntap('btn-clear', clearAllRecords);\ntap('btn-rec-menu', () => showScreen('menu-screen'));\ntap('btn-fullscreen', () => {\n  if (!document.fullscreenElement && !document.webkitFullscreenElement) {\n    (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen).call(document.documentElement);\n  } else {\n    (document.exitFullscreen || document.webkitExitFullscreen).call(document);\n  }\n});\ntap('fanfare-close', closeFanfare);\n\n// ── 닉네임 UI ──\nfunction goNickname(mode) {\n  currentMode = mode;\n  const count = mode === 'solo' ? 1 : mode === 'duo' ? 2 : relayCount;\n  buildNickUI(count);\n  document.getElementById('nick-title').innerText =\n    mode === 'solo' ? '선수 등록' : mode === 'duo' ? '2인 선수 등록' : '릴레이 선수 등록';\n  document.getElementById('relay-count-row').classList.toggle('hidden', mode !== 'relay');\n  showScreen('nickname-screen');\n}\n\nfunction buildNickUI(count) {\n  const used = [];\n  const container = document.getElementById('nickname-container');\n  container.innerHTML = '';\n  for (let i = 0; i \u003c count; i++) {\n    const nick = randomNick(used);\n    used.push(nick);\n    const { emoji, name } = parseNick(nick);\n    const row = document.createElement('div');\n    row.className = 'nick-row';\n    row.dataset.idx = i;\n    row.innerHTML = `\u003cspan class=\"nick-label\">${emoji}\u003c/span>\u003cspan class=\"nick-name\">${name}\u003c/span>\u003cbutton class=\"nick-reroll\" id=\"reroll-${i}\"> 다시\u003c/button>`;\n    container.appendChild(row);\n  }\n  // 다시 버튼 이벤트 (동적 생성이라 직접 등록)\n  for (let i = 0; i \u003c count; i++) {\n    tap(`reroll-${i}`, () => rerollNick(i));\n  }\n}\n\nfunction rerollNick(idx) {\n  const rows = document.querySelectorAll('.nick-row');\n  const used = Array.from(rows).filter((_,i)=>i!==idx).map(r =>\n    r.querySelector('.nick-label').innerText + r.querySelector('.nick-name').innerText\n  );\n  const nick = randomNick(used);\n  const { emoji, name } = parseNick(nick);\n  rows[idx].querySelector('.nick-label').innerText = emoji;\n  rows[idx].querySelector('.nick-name').innerText = name;\n}\n\nfunction changeRelayCount(d) {\n  relayCount = Math.min(15, Math.max(2, relayCount + d));\n  document.getElementById('relay-count-display').innerText = relayCount;\n  buildNickUI(relayCount);\n}\n\nfunction getPlayersFromUI() {\n  return Array.from(document.querySelectorAll('.nick-row')).map(r => {\n    const emoji = r.querySelector('.nick-label').innerText;\n    const name = r.querySelector('.nick-name').innerText;\n    return { emoji, name, full: emoji + name };\n  });\n}\n\nfunction startMode() {\n  players = getPlayersFromUI();\n  if (currentMode === 'solo') startSolo();\n  else if (currentMode === 'duo') startDuoMode();\n  else startRelay();\n}\n\n// ── 오디오 ──\nlet audioCtx;\nfunction initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }\nfunction playTone(freq, dur, vol=0.12) {\n  initAudio();\n  if (audioCtx.state === 'suspended') audioCtx.resume();\n  const o = audioCtx.createOscillator(), g = audioCtx.createGain();\n  o.connect(g); g.connect(audioCtx.destination);\n  o.frequency.setValueAtTime(freq, audioCtx.currentTime);\n  g.gain.setValueAtTime(Math.min(0.65, vol * 2.8), audioCtx.currentTime);\n  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);\n  o.start(); o.stop(audioCtx.currentTime + dur);\n}\nfunction playStart() { playTone(880,0.15,0.2); setTimeout(()=>playTone(1100,0.15,0.2),130); }\nfunction playFinish() { [660,880,1100].forEach((f,i)=>setTimeout(()=>playTone(f,0.2,0.18),i*80)); }\nfunction playRecord() { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>playTone(f,0.3,0.2),i*100)); }\n\n// ── 컨페티 ──\nconst cvs = document.getElementById('confetti-canvas');\nconst ctx2 = cvs.getContext('2d');\nlet cparts = [], crun = false;\nfunction launchConfetti() {\n  cvs.width = innerWidth; cvs.height = innerHeight;\n  const cols = ['#ffd700','#ff3d6b','#00e5ff','#00e676','#ff9100','#fff'];\n  cparts = Array.from({length:200}, () => ({\n    x: Math.random()*cvs.width, y: -20,\n    w: Math.random()*10+4, h: Math.random()*6+3,\n    color: cols[Math.floor(Math.random()*cols.length)],\n    vx: (Math.random()-0.5)*5, vy: Math.random()*4+2,\n    rot: Math.random()*360, vrot: (Math.random()-0.5)*8, life: 1\n  }));\n  crun = true; animateC();\n}\nfunction animateC() {\n  if (!crun) return;\n  ctx2.clearRect(0,0,cvs.width,cvs.height);\n  cparts.forEach(p => {\n    p.x+=p.vx; p.y+=p.vy; p.rot+=p.vrot; p.life-=0.005;\n    ctx2.save(); ctx2.globalAlpha=Math.max(0,p.life);\n    ctx2.translate(p.x,p.y); ctx2.rotate(p.rot*Math.PI/180);\n    ctx2.fillStyle=p.color; ctx2.fillRect(-p.w/2,-p.h/2,p.w,p.h);\n    ctx2.restore();\n  });\n  cparts = cparts.filter(p=>p.life>0);\n  if (cparts.length) requestAnimationFrame(animateC);\n  else { crun=false; ctx2.clearRect(0,0,cvs.width,cvs.height); }\n}\n\n// ── 팡파레 ──\nlet fanfareCb = null;\nfunction showFanfare(label, emoji, timeStr, cb) {\n  document.getElementById('fanfare-name').innerText = emoji + ' ' + label;\n  document.getElementById('fanfare-time').innerText = timeStr;\n  document.getElementById('fanfare-overlay').classList.add('show');\n  fanfareCb = cb || null;\n  launchConfetti(); playRecord();\n}\nfunction closeFanfare() {\n  document.getElementById('fanfare-overlay').classList.remove('show');\n  if (fanfareCb) { fanfareCb(); fanfareCb = null; }\n}\n\n// ── localStorage ──\nfunction getRecords() { return JSON.parse(localStorage.getItem('run_records') || '{\"solo\":{},\"duo\":{},\"relay\":{}}'); }\nfunction saveRecords(r) { localStorage.setItem('run_records', JSON.stringify(r)); }\nfunction checkAndSaveBest(cat, key, ms) {\n  const r = getRecords();\n  if (!r[cat]) r[cat] = {};\n  const prev = r[cat][key];\n  const isNew = !prev || ms \u003c prev;\n  if (isNew) r[cat][key] = ms;\n  saveRecords(r); return isNew;\n}\nfunction getBest(cat, key) { return getRecords()[cat]?.[key] || null; }\nfunction clearAllRecords() {\n  if (confirm('모든 기록을 삭제할까요?')) { localStorage.removeItem('run_records'); renderRecordsScreen(); }\n}\n\n// ── 시간 포맷 ──\nfunction fmt(ms) {\n  ms = Math.floor(ms);\n  const tot = Math.floor(ms/1000), m = Math.floor(tot/60), s = tot%60, msec = ms%1000;\n  return m > 0 ? `${m}:${String(s).padStart(2,'0')}.${String(msec).padStart(3,'0')}`\n               : `${String(s).padStart(2,'0')}.${String(msec).padStart(3,'0')}`;\n}\n\n// ── 1인 모드 ──\nfunction startSolo() {\n  soloState = 'idle'; clearInterval(soloTimer);\n  soloSession = []; clearSidebar('solo-sidebar-list');\n  const p = players[0];\n  document.getElementById('solo-name').innerText = p.emoji + ' ' + p.name;\n  document.getElementById('solo-status').innerText = '화면을 터치하면 출발!';\n  document.getElementById('solo-time').innerText = '00.000';\n  document.getElementById('solo-time').className = 'solo-time';\n  document.getElementById('solo-main').className = 'solo-main state-idle';\n  document.getElementById('solo-hint').innerHTML = ' \u003cspan>터치\u003c/span>하여 출발';\n  soloPrevBest = getBest('solo', p.full);\n  showScreen('solo-screen');\n}\n\nfunction soloTap() {\n  initAudio();\n  if (soloState === 'idle') {\n    // 첫 터치 = 바로 출발\n    soloState = 'running'; soloStart = performance.now();\n    document.getElementById('solo-main').className = 'solo-main state-running';\n    document.getElementById('solo-status').innerText = '달리는 중...';\n    document.getElementById('solo-hint').innerHTML = '돌아와서 \u003cspan>터치!\u003c/span>';\n    playStart();\n    soloTimer = setInterval(() => {\n      document.getElementById('solo-time').innerText = fmt(performance.now()-soloStart);\n    }, 30);\n  } else if (soloState === 'running') {\n    // 두 번째 터치 = 기록\n    const elapsed = Math.round(performance.now()-soloStart);\n    clearInterval(soloTimer); soloState = 'done';\n    document.getElementById('solo-time').innerText = fmt(elapsed);\n    document.getElementById('solo-time').className = 'solo-time stopped';\n    document.getElementById('solo-main').className = 'solo-main state-done';\n    document.getElementById('solo-status').innerText = '기록!';\n    document.getElementById('solo-hint').classList.add('hidden');\n    document.getElementById('solo-again-btn').classList.remove('hidden');\n    playFinish();\n    const p = players[0];\n    const prevBest = soloPrevBest;\n    const isNew = checkAndSaveBest('solo', p.full, elapsed);\n    soloPrevBest = getBest('solo', p.full);\n    addSidebarItem('solo-sidebar-list', p.emoji, p.name, elapsed, isNew);\n    if (isNew && prevBest !== null && elapsed \u003c prevBest) {\n      setTimeout(() => showFanfare(p.name, p.emoji, fmt(elapsed)), 300);\n    }\n  } else if (soloState === 'done') {\n    // 화면 터치해도 재시작 안 함 (버튼으로만)\n  }\n}\n\nfunction showSoloResult(p, elapsed) {\n  document.getElementById('result-title').innerText = ' 결과';\n  document.getElementById('relay-team-box').classList.add('hidden');\n  const best = getBest('solo', p.full);\n  const isNew = best === elapsed;\n  document.getElementById('result-list').innerHTML =\n    `\u003cdiv class=\"result-row rank1\">\n      \u003cspan class=\"result-rank\">1위\u003c/span>\n      \u003cspan class=\"result-emoji\">${p.emoji}\u003c/span>\n      \u003cspan class=\"result-name\">${p.name}\u003c/span>\n      \u003cspan class=\"result-time\">${fmt(elapsed)}\u003c/span>\n      ${isNew ? '\u003cspan class=\"result-new\">신기록\u003c/span>' : ''}\n    \u003c/div>\n    \u003cdiv class=\"best-record-box\"> 최고기록: \u003cstrong>${best ? fmt(best) : '-'}\u003c/strong>\u003c/div>`;\n  resultMode = 'solo';\n  showScreen('result-screen');\n}\n\n// ── 2인 모드 ──\nfunction startDuoMode() {\n  duoState = ['idle','idle']; duoTimes = [null,null]; clearInterval(duoTimer);\n  duoSession = []; clearSidebar('duo-sidebar-list');\n  players.forEach((p,i) => {\n    document.getElementById(`duo-name-${i}`).innerText = p.emoji + ' ' + p.name;\n    document.getElementById(`duo-status-${i}`).innerText = '대기 중';\n    document.getElementById(`duo-time-${i}`).innerText = '00.000';\n    document.getElementById(`duo-time-${i}`).className = 'duo-time';\n    document.getElementById(`duo-rank-${i}`).innerHTML = '';\n    document.getElementById(i===0?'duo-left':'duo-right').className = `duo-half ${i===0?'left':'right'} state-idle`;\n  });\n  document.getElementById('duo-overlay-names').innerText = `${players[0].emoji}${players[0].name}  VS  ${players[1].emoji}${players[1].name}`;\n  document.getElementById('duo-start-overlay').style.display = 'flex';\n  showScreen('duo-screen');\n}\n\nfunction duoStart() {\n  initAudio();\n  document.getElementById('duo-start-overlay').style.display = 'none';\n  duoState = [\"running\",\"running\"]; duoStartTime = performance.now();\n  playStart();\n  players.forEach((_,i) => {\n    document.getElementById(`duo-status-${i}`).innerText = '달리는 중!';\n    document.getElementById(i===0?'duo-left':'duo-right').className = `duo-half ${i===0?'left':'right'} state-running`;\n  });\n  duoTimer = setInterval(() => {\n    players.forEach((_,i) => {\n      if (duoState[i]==='running')\n        document.getElementById(`duo-time-${i}`).innerText = fmt(performance.now()-duoStartTime);\n    });\n  }, 30);\n}\n\nfunction duoTap(idx) {\n  if (duoState[idx] !== 'running') return;\n  const elapsed = Math.round(performance.now()-duoStartTime);\n  duoState[idx] = 'done'; duoTimes[idx] = elapsed;\n  document.getElementById(`duo-time-${idx}`).innerText = fmt(elapsed);\n  document.getElementById(`duo-time-${idx}`).className = 'duo-time stopped';\n  document.getElementById(idx===0?'duo-left':'duo-right').className = `duo-half ${idx===0?'left':'right'} state-done`;\n  document.getElementById(`duo-status-${idx}`).innerText = '완주!';\n  playFinish();\n  const isNewDuo = checkAndSaveBest('duo', players[idx].full, elapsed);\n  addSidebarItem('duo-sidebar-list', players[idx].emoji, players[idx].name, elapsed, isNewDuo);\n  // 둘 다 완주했을 때만 타이머 정지 + 결과 표시\n  if (duoState[0]==='done' && duoState[1]==='done') {\n    clearInterval(duoTimer);\n    setTimeout(showDuoResult, 600);\n  }\n  // 한 명만 완주 → 상대방 타이머는 계속 돌아감 (clearInterval 안 함)\n}\n\nfunction showDuoResult() {\n  const sorted = [0,1].map(i=>({p:players[i],t:duoTimes[i]})).sort((a,b)=>a.t-b.t);\n  const winner = sorted[0], loser = sorted[1];\n  const diff = Math.abs(duoTimes[0]-duoTimes[1]);\n  // 오버레이에 결과 표시\n  document.getElementById('duo-finish-result').innerHTML =\n    `\u003cdiv class=\"duo-winner-text\"> ${winner.p.emoji} ${winner.p.name} 승!\u003c/div>\n     \u003cdiv class=\"duo-diff-text\">차이: ${fmt(diff)}\u003c/div>`;\n  document.getElementById('duo-finish-overlay').classList.remove('hidden');\n  // 신기록 팡파레\n  const prevBest = getBest('duo', winner.p.full);\n  if (prevBest === winner.t) showFanfare(winner.p.name, winner.p.emoji, fmt(winner.t));\n}\n\n// ── 릴레이 모드 ──\nfunction startRelay() {\n  relayIdx=0; relayState='idle'; relayTimes=[]; relayTotal=0; clearInterval(relayTimer);\n  relaySession=[]; clearSidebar('relay-sidebar-list');\n  document.getElementById('relay-title').innerText = `릴레이 (${players.length}명)`;\n  document.getElementById('relay-total').innerText = '팀: --';\n  buildRelayProgress(); setRelayUI();\n  document.getElementById('relay-main').className = 'relay-main state-idle';\n  document.getElementById('relay-hint').innerHTML = ' \u003cspan>터치\u003c/span>하여 출발';\n  showScreen('relay-screen');\n}\n\nfunction buildRelayProgress() {\n  document.getElementById('relay-progress').innerHTML =\n    players.map((p,i) => `\u003cdiv class=\"relay-pip\" id=\"relay-pip-${i}\">${p.emoji}\u003c/div>`).join('');\n}\n\nfunction setRelayUI() {\n  const p = players[relayIdx];\n  document.getElementById('relay-current-num').innerText = `${relayIdx+1}번 선수`;\n  document.getElementById('relay-current-name').innerText = p.emoji + ' ' + p.name;\n  document.getElementById('relay-current-time').innerText = '00.000';\n  players.forEach((_,i) => {\n    document.getElementById(`relay-pip-${i}`).className =\n      'relay-pip' + (i\u003crelayIdx?' done':i===relayIdx?' active':'');\n  });\n}\n\nfunction relayTap() {\n  initAudio();\n  if (relayState === 'idle') {\n    relayState = 'running'; relayStart = performance.now();\n    document.getElementById('relay-main').className = 'relay-main state-running';\n    document.getElementById('relay-hint').innerHTML = '돌아와서 \u003cspan>터치!\u003c/span>';\n    playStart();\n    relayTimer = setInterval(() => {\n      document.getElementById('relay-current-time').innerText = fmt(performance.now()-relayStart);\n    }, 30);\n  } else if (relayState === 'running') {\n    const elapsed = Math.round(performance.now()-relayStart);\n    clearInterval(relayTimer);\n    relayTimes.push(elapsed); relayTotal += elapsed;\n    document.getElementById('relay-current-time').innerText = fmt(elapsed);\n    document.getElementById('relay-main').className = 'relay-main state-done';\n    document.getElementById(`relay-pip-${relayIdx}`).className = 'relay-pip done';\n    document.getElementById('relay-total').innerText = `팀: ${fmt(relayTotal)}`;\n    playFinish();\n    const p = players[relayIdx];\n    const isNewRelay = checkAndSaveBest('relay_individual', p.full, elapsed);\n    addSidebarItem('relay-sidebar-list', p.emoji, p.name, elapsed, isNewRelay);\n    relayIdx++;\n    if (relayIdx >= players.length) {\n      relayState = 'idle';\n      document.getElementById('relay-hint').innerHTML = '릴레이 완료! ';\n      setTimeout(showRelayResult, 700);\n    } else {\n      // 다음 선수 자동 출발 (터치 없이 바로 타이머 시작)\n      setRelayUI();\n      relayState = 'running';\n      relayStart = performance.now();\n      document.getElementById('relay-main').className = 'relay-main state-running';\n      document.getElementById('relay-hint').innerHTML = `${players[relayIdx].emoji} 달리는 중! \u003cspan>도착하면 터치!\u003c/span>`;\n      playStart();\n      relayTimer = setInterval(() => {\n        document.getElementById('relay-current-time').innerText = fmt(performance.now()-relayStart);\n      }, 30);\n    }\n  }\n}\n\nfunction showRelayResult() {\n  document.getElementById('result-title').innerText = ' 릴레이 결과';\n  document.getElementById('relay-team-box').classList.remove('hidden');\n  document.getElementById('relay-team-time').innerText = fmt(relayTotal);\n  const teamKey = players.map(p=>p.full).join(',');\n  const isTeamNew = checkAndSaveBest('relay', teamKey, relayTotal);\n  const sorted = players.map((p,i)=>({p,t:relayTimes[i]})).sort((a,b)=>a.t-b.t);\n  const medals = ['1위','2위','3위'];\n  document.getElementById('result-list').innerHTML = sorted.map((s,r) => {\n    const best = getBest('relay_individual', s.p.full);\n    const isNew = checkAndSaveBest('relay_individual', s.p.full, s.t);\n    return `\u003cdiv class=\"result-row ${r\u003c3?'rank'+(r+1):''}\" style=\"animation-delay:${r*0.08}s\">\n      \u003cspan class=\"result-rank\">${medals[r]||''}\u003c/span>\n      \u003cspan class=\"result-emoji\">${s.p.emoji}\u003c/span>\n      \u003cspan class=\"result-name\">${s.p.name}\u003c/span>\n      \u003cspan class=\"result-time\">${fmt(s.t)}\u003c/span>\n      ${isNew?'\u003cspan class=\"result-new\">신기록\u003c/span>':''}\n    \u003c/div>\n    \u003cdiv class=\"best-record-box\"> 최고: \u003cstrong>${best ? fmt(best) : '-'}\u003c/strong>\u003c/div>`;\n  }).join('');\n  resultMode = 'relay';\n  showScreen('result-screen');\n  if (isTeamNew) showFanfare('팀 신기록!', '', fmt(relayTotal));\n}\n\n// ── 다시 하기 ──\nfunction playAgain() {\n  if (resultMode==='solo') startSolo();\n  else if (resultMode==='duo') startDuoMode();\n  else startRelay();\n}\n\n// ── 기록 화면 ──\nfunction renderRecordsScreen() {\n  const r = getRecords();\n  let html = '';\n  const soloE = Object.entries(r.solo||{}).sort((a,b)=>a[1]-b[1]);\n  if (soloE.length) {\n    html += `\u003cdiv class=\"rec-section\">\u003ch3> 1인 기록\u003c/h3>${soloE.map(([n,ms],i)=>`\u003cdiv class=\"rec-item\">\u003cspan class=\"rec-name\">${i===0?' ':''}${n}\u003c/span>\u003cspan class=\"rec-val\">${fmt(ms)}\u003c/span>\u003c/div>`).join('')}\u003c/div>`;\n  }\n  const duoE = Object.entries(r.duo||{}).sort((a,b)=>a[1]-b[1]);\n  if (duoE.length) {\n    html += `\u003cdiv class=\"rec-section\" style=\"margin-top:16px\">\u003ch3> 2인 기록\u003c/h3>${duoE.map(([n,ms],i)=>`\u003cdiv class=\"rec-item\">\u003cspan class=\"rec-name\">${i===0?' ':''}${n}\u003c/span>\u003cspan class=\"rec-val\">${fmt(ms)}\u003c/span>\u003c/div>`).join('')}\u003c/div>`;\n  }\n  const relayE = Object.entries(r.relay||{}).sort((a,b)=>a[1]-b[1]);\n  if (relayE.length) {\n    html += `\u003cdiv class=\"rec-section\" style=\"margin-top:16px\">\u003ch3> 릴레이 기록\u003c/h3>${relayE.map(([k,ms],i)=>`\u003cdiv class=\"rec-item\">\u003cspan class=\"rec-name\">${i===0?' ':''}${k.split(',').map(n=>n[0]).join('')}\u003c/span>\u003cspan class=\"rec-val\">${fmt(ms)}\u003c/span>\u003c/div>`).join('')}\u003c/div>`;\n  }\n  document.getElementById('records-content').innerHTML = html || `\u003cdiv style=\"text-align:center;color:var(--text-dim);padding:40px\">아직 기록이 없습니다\u003c/div>`;\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"},{"name":"라운드 타이머","html":"\u003c!DOCTYPE html>\r\n\u003chtml lang=\"ko\">\r\n\u003chead>\r\n    \u003cmeta charset=\"UTF-8\">\r\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\r\n    \u003ctitle>국가대표마스터태권도장 라운드 타이머\u003c/title>\r\n    \u003cstyle>\r\n        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: sans-serif; overflow: hidden; background-color: #1a1a1a; color: white; }\r\n        #timer-screen { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: background-color 0.4s; }\r\n        \r\n        #status-text { font-size: 4rem; font-weight: bold; margin-bottom: 20px; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }\r\n        #round-info { font-size: 2.5rem; margin-bottom: 10px; opacity: 0.8; }\r\n        #time-display { font-size: 22rem; font-weight: 900; line-height: 1; text-shadow: 5px 5px 30px rgba(0,0,0,0.6); font-variant-numeric: tabular-nums; }\r\n\r\n        /* 설정 메뉴 */\r\n        #setup-menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a1a; z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; }\r\n        .input-group { margin: 15px; text-align: center; }\r\n        .input-group label { display: block; font-size: 1.1rem; color: #aaa; margin-bottom: 8px; }\r\n        .input-group input { width: 110px; padding: 15px; font-size: 1.5rem; text-align: center; border-radius: 12px; border: none; background: #333; color: white; }\r\n        \r\n        .start-btn { margin-top: 40px; padding: 20px 60px; font-size: 2rem; font-weight: bold; background: #27AE60; color: white; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }\r\n        .btn-fs { padding: 10px 20px; font-size: 0.9rem; background: #444; color: #ccc; border: none; border-radius: 20px; cursor: pointer; margin-top: 25px; }\r\n\r\n        .control-btns { position: absolute; top: 20px; right: 20px; display: none; gap: 12px; z-index: 50; }\r\n        .sub-btn { padding: 10px 18px; background: rgba(0,0,0,0.4); color: white; border: 1px solid rgba(255,255,255,0.4); border-radius: 10px; cursor: pointer; font-size: 1rem; }\r\n\r\n        /* 상태 배경색 */\r\n        .state-prep { background-color: #F1C40F !important; color: black !important; }\r\n        .state-action { background-color: #2ECC71 !important; color: white !important; }\r\n        .state-rest { background-color: #E74C3C !important; color: white !important; }\r\n        \r\n        #dojang-tag { position: absolute; bottom: 30px; font-size: 2rem; font-weight: bold; color: rgba(255,255,255,0.2); pointer-events: none; }\r\n    \u003c/style>\r\n\u003cstyle>\n:root{color-scheme:dark;--board:#171a16;--surface:#24281f;--edge:#454b3d;--ink:#f5f7eb;--quiet:#c8cfbe;--mint:#d6f570;--amber:#ffba78}\nhtml,body{background:var(--board)!important;color:var(--ink)!important}\nbody,button,input,select,textarea{font-family:system-ui,\"Malgun Gothic\",sans-serif!important}\nh1,h2,h3{letter-spacing:-.04em}h1,h2,h3,strong{color:inherit}\nbutton{border-radius:10px!important;background:var(--surface)!important;border:1px solid var(--edge)!important;color:var(--ink)!important;box-shadow:none!important;text-shadow:none!important;font-weight:700!important}\nbutton:hover:not(:disabled){border-color:var(--mint)!important}\nbutton:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--mint);outline-offset:3px}\nbutton:disabled{opacity:.46}\ninput:not([type=checkbox]):not([type=radio]),select,textarea{background:#1d211a!important;border:1px solid var(--edge)!important;color:var(--ink)!important;border-radius:8px!important}\ninput::placeholder,textarea::placeholder{color:var(--quiet)!important}\ninput[type=checkbox],input[type=radio],progress{accent-color:var(--mint)}\n.primary,.start-btn,.start-big-btn,#toggle,#start,#draw,button.active,button[aria-pressed=true]{background:var(--mint)!important;color:#1e2811!important;border-color:var(--mint)!important}\n#timer,#time-display,#result,.solo-time,.duo-time,.relay-current-time,.result-time,#best-record-info{font-variant-numeric:tabular-nums;letter-spacing:-.055em;text-shadow:none!important}\n@keyframes board-reveal{from{opacity:.65;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}\n@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}\n#setup-menu,#timer-screen{background:var(--board)}#setup-menu>div{flex-wrap:wrap;justify-content:center;gap:4px!important}#setup-menu h1{font-size:clamp(1.6rem,6vw,3rem);margin:0 0 20px!important}#time-display{font-size:min(35vw,53vh,22rem)}#status-text{font-size:clamp(1.5rem,6vw,4rem);text-shadow:none}#round-info{font-size:clamp(1rem,4vw,2rem)}#timer-screen{box-shadow:inset 0 0 0 8px var(--edge)}#timer-screen.state-prep{background:#392b20!important;color:var(--amber)!important;box-shadow:inset 0 0 0 8px var(--amber)}#timer-screen.state-action{background:#303d1a!important;color:var(--mint)!important;box-shadow:inset 0 0 0 8px var(--mint)}#timer-screen.state-rest{background:#31372c!important;color:var(--ink)!important;box-shadow:inset 0 0 0 8px #b7c2a8}#dojang-tag{display:none}#setup-menu .input-group{margin:8px}#setup-menu input{width:96px}.start-btn{margin-top:24px}\u003c/style>\u003c/head>\r\n\u003cbody>\r\n\r\n    \u003cdiv id=\"setup-menu\">\r\n        \u003ch1 style=\"margin-bottom: 40px;\">라운드 타이머\u003c/h1>\r\n        \u003cdiv style=\"display: flex; gap: 20px;\">\r\n            \u003cdiv class=\"input-group\">\u003clabel>라운드 수\u003c/label>\u003cinput type=\"number\" id=\"input-rounds\" value=\"3\">\u003c/div>\r\n            \u003cdiv class=\"input-group\">\u003clabel>운동시간(초)\u003c/label>\u003cinput type=\"number\" id=\"input-action\" value=\"60\">\u003c/div>\r\n            \u003cdiv class=\"input-group\">\u003clabel>휴식시간(초)\u003c/label>\u003cinput type=\"number\" id=\"input-rest\" value=\"30\">\u003c/div>\r\n        \u003c/div>\r\n        \u003cbutton class=\"start-btn\" onclick=\"initTimer()\">훈련 시작\u003c/button>\r\n        \u003cbutton class=\"btn-fs\" onclick=\"toggleFullScreen()\"> 전체 화면 모드\u003c/button>\r\n    \u003c/div>\r\n\r\n    \u003cdiv class=\"control-btns\" id=\"controls\">\r\n        \u003cbutton class=\"sub-btn\" onclick=\"togglePause()\" id=\"pause-btn\">일시정지\u003c/button>\r\n        \u003cbutton class=\"sub-btn\" onclick=\"resetToMenu()\">종료\u003c/button>\r\n    \u003c/div>\r\n\r\n    \u003cdiv id=\"timer-screen\">\r\n        \u003cdiv id=\"round-info\">ROUND 1 / 3\u003c/div>\r\n        \u003cdiv id=\"status-text\">준비\u003c/div>\r\n        \u003cdiv id=\"time-display\">05\u003c/div>\r\n        \u003cdiv id=\"dojang-tag\">국가대표마스터태권도장\u003c/div>\r\n    \u003c/div>\r\n\r\n    \u003cscript>\r\n        let rounds, actionTime, restTime, currentRound = 1, timeLeft = 5, currentState = 'prep', isPaused = false, timerInterval;\r\n        const screen = document.getElementById('timer-screen'), timeDisplay = document.getElementById('time-display'), statusText = document.getElementById('status-text'), roundInfo = document.getElementById('round-info'), setupMenu = document.getElementById('setup-menu'), controls = document.getElementById('controls');\r\n        let audioCtx;\r\n\r\n        function playSound(freq, duration, volume = 0.15) {\r\n            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();\r\n            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();\r\n            osc.connect(gain); gain.connect(audioCtx.destination);\r\n            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);\r\n            gain.gain.setValueAtTime(Math.min(0.65, volume * 2.8), audioCtx.currentTime);\r\n            osc.start(); osc.stop(audioCtx.currentTime + duration);\r\n        }\r\n\r\n        function playBiBik() {\r\n            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();\r\n            const now = audioCtx.currentTime;\r\n            [900, 1000].forEach((f, i) => {\r\n                const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();\r\n                osc.connect(gain); gain.connect(audioCtx.destination);\r\n                osc.frequency.setValueAtTime(f, now + (i * 0.12));\r\n                gain.gain.setValueAtTime(0.48, now + (i * 0.12));\r\n                osc.start(now + (i * 0.12)); osc.stop(now + (i * 0.12) + 0.08);\r\n            });\r\n        }\r\n\r\n        function initTimer() {\r\n            rounds = parseInt(document.getElementById('input-rounds').value);\r\n            actionTime = parseInt(document.getElementById('input-action').value);\r\n            restTime = parseInt(document.getElementById('input-rest').value);\r\n            currentRound = 1; timeLeft = 5; currentState = 'prep'; isPaused = false;\r\n            setupMenu.style.display = 'none'; controls.style.display = 'flex';\r\n            updateDisplay(); startCountdown();\r\n        }\r\n\r\n        function startCountdown() {\r\n            if (timerInterval) clearInterval(timerInterval);\r\n            timerInterval = setInterval(() => {\r\n                if (!isPaused) {\r\n                    if (timeLeft > 0) {\r\n                        timeLeft--;\r\n                        updateDisplay();\r\n                        \r\n                        // 3, 2, 1초에 삑 소리\r\n                        if (timeLeft >= 1 && timeLeft \u003c= 3) {\r\n                            playSound(600, 0.1); \r\n                        } \r\n                        // 00초에 삐~~~ 긴 소리\r\n                        else if (timeLeft === 0) {\r\n                            playSound(400, 0.8);\r\n                        }\r\n                    } else {\r\n                        // 00초에서 1초 대기 후 다음 단계로 전환\r\n                        nextState();\r\n                    }\r\n                }\r\n            }, 1000);\r\n        }\r\n\r\n        function nextState() {\r\n            if (currentState === 'prep' || currentState === 'rest') {\r\n                currentState = 'action';\r\n                timeLeft = actionTime;\r\n                playBiBik(); // 시작할 때 삐빅\r\n            } else {\r\n                if (currentRound >= rounds) return finishTraining();\r\n                currentState = 'rest';\r\n                timeLeft = restTime;\r\n                currentRound++;\r\n                playBiBik(); // 휴식 시작할 때 삐빅\r\n            }\r\n            updateDisplay();\r\n        }\r\n\r\n        function updateDisplay() {\r\n            timeDisplay.innerText = timeLeft.toString().padStart(2, '0');\r\n            roundInfo.innerText = `ROUND ${currentRound} / ${rounds}`;\r\n            screen.className = '';\r\n            if (currentState === 'prep') { screen.classList.add('state-prep'); statusText.innerText = \"준비(PREP)\"; }\r\n            else if (currentState === 'action') { screen.classList.add('state-action'); statusText.innerText = \"운동(ACTION)\"; }\r\n            else if (currentState === 'rest') { screen.classList.add('state-rest'); statusText.innerText = \"휴식(REST)\"; }\r\n        }\r\n\r\n        function finishTraining() { clearInterval(timerInterval); statusText.innerText = \"훈련 종료\"; timeDisplay.innerText = \"END\"; screen.style.backgroundColor = \"#222\"; playSound(800, 1.5); }\r\n        function togglePause(
