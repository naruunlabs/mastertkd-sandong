<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>낙서장 관리</title>
<style>
  body { margin: 0; padding: 16px; font-family: "Malgun Gothic", system-ui, sans-serif; background: #f4f4f0; color: #161f38; line-height: 1.5; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  p { margin: 6px 0; }
  .soft { color: #5a616d; font-size: 14px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
  input { width: 110px; padding: 10px; font-size: 16px; border: 1px solid #9aa3b5; }
  button { padding: 10px 14px; font-size: 15px; font-weight: 700; border: 0; background: #161f38; color: #fff; }
  button.del { width: 100%; background: #b92a2c; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .card { background: #fff; border: 1px solid #d5d8de; padding: 8px; }
  canvas { width: 100%; aspect-ratio: 1; display: block; border: 1px solid #d5d8de; }
  .when { font-size: 13px; margin: 6px 0; }
  .wait { color: #b92a2c; font-weight: 700; }
</style>
</head>
<body>
<h1>낙서장 관리</h1>
<p class="soft">그린 뒤 24시간이 지나면 자동으로 벽에 걸려요. 이상한 그림만 지우면 됩니다. 이 주소는 남에게 보내지 마세요.</p>
<div class="row">
  <label for="code">도장 코드</label>
  <input id="code" inputmode="numeric" maxlength="8" autocomplete="off">
  <button id="saveCode">코드 바꾸기</button>
</div>
<p id="status" class="soft" aria-live="polite">불러오는 중이에요</p>
<div class="grid" id="grid"></div>
<script>
const CFG = {
  site: 'mastertkd-sandong',
  rpc: 'https://ebgoolsymyzkftvavpyj.supabase.co/rest/v1/rpc/dojang_doodle_admin',
  key: 'sb_publishable_378Ep28vw4J9Sia2OsN6-Q_gqnu5OQJ',
  colors: ['#1a1a1f', '#d6322a', '#1d4fc2', '#f0c419', '#2c8a43', '#6a3fa8']
};
const $ = id => document.getElementById(id);
const adminKey = location.hash.slice(1);

async function call(extra) {
  const res = await fetch(CFG.rpc, {
    method: 'POST',
    headers: { apikey: CFG.key, 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign({ p_site: CFG.site, p_key: adminKey }, extra))
  });
  if (!res.ok) throw new Error(res.status);
  return res.json();
}
function draw(canvas, b64) {
  const g = canvas.getContext('2d'), size = canvas.width, k = size / 254, s = atob(b64);
  g.lineCap = g.lineJoin = 'round';
  g.lineWidth = 6 * k;
  let open = false, first = false;
  for (let i = 0; i + 1 < s.length; i += 2) {
    const a = s.charCodeAt(i), b = s.charCodeAt(i + 1);
    if (a === 255) {
      if (open) g.stroke();
      g.strokeStyle = CFG.colors[b] || CFG.colors[0];
      g.beginPath();
      open = first = true;
    } else if (open) {
      if (first) { g.moveTo(a * k, b * k); first = false; }
      g.lineTo(a * k, b * k);
    }
  }
  if (open) g.stroke();
}
function show(r) {
  if (r.error) { $('status').textContent = r.error === 'key' ? '관리 주소가 맞지 않아요.' : '코드는 숫자 4~8자리로 넣어주세요.'; return; }
  $('code').value = r.code;
  $('status').textContent = r.items.length ? `낙서 ${r.items.length}장` : '아직 낙서가 없어요.';
  const grid = $('grid');
  grid.textContent = '';
  r.items.forEach(item => {
    const card = document.createElement('div'); card.className = 'card';
    const c = document.createElement('canvas'); c.width = c.height = 300;
    draw(c, item.data);
    const at = new Date(item.created_at), left = at.getTime() + 864e5 - Date.now();
    const when = document.createElement('p'); when.className = 'when';
    if (left > 0) { when.classList.add('wait'); when.textContent = `${Math.ceil(left / 36e5)}시간 뒤 공개`; }
    else when.textContent = '공개됨 · ' + at.toLocaleDateString('ko-KR');
    const del = document.createElement('button'); del.className = 'del'; del.textContent = '삭제';
    del.addEventListener('click', async () => {
      if (!confirm('이 낙서를 지울까요? 되돌릴 수 없어요.')) return;
      try { show(await call({ p_delete: item.id })); } catch (e) { $('status').textContent = '지우지 못했어요. 다시 해주세요.'; }
    });
    card.append(c, when, del);
    grid.appendChild(card);
  });
}
$('saveCode').addEventListener('click', async () => {
  try {
    const r = await call({ p_new_code: $('code').value.trim() });
    show(r);
    if (!r.error) $('status').textContent = '코드를 바꿨어요. ' + $('status').textContent;
  } catch (e) { $('status').textContent = '바꾸지 못했어요. 다시 해주세요.'; }
});
call({}).then(show).catch(() => { $('status').textContent = '불러오지 못했어요.'; });
</script>
</body>
</html>
