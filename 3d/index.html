:root {

[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--ink); color: var(--dobok); font-family: var(--font-body); font-size: 15px; }

.hud-top {

}

.hud-bottom {
  position: fixed; z-index: 2; pointer-events: none;

}

.action { pointer-events: auto; border: 0; background: var(--hong); color: #fff; font-family: var(--font-display); font-size: 17px; padding: 10px 20px; }
.action.alt { background: var(--cheong); }
.places { pointer-events: auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; }

.veil {

  padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-bottom, 0px));

  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet { background: var(--dobok); color: var(--ink); width: 100%; max-width: 640px; max-height: 100%; display: flex; flex-direction: column; min-width: 0; border-top: 8px solid var(--ink); }
.sheet header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 18px 8px; }
.sheet h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 24px; text-wrap: balance; }
.close { border: 0; background: var(--ink); color: var(--dobok); padding: 7px 13px; font-size: 14px; flex: none; }
.tabs { display: flex; gap: 4px; padding: 0 18px; border-bottom: 2px solid var(--ink); overflow-x: auto; flex: none; scrollbar-width: none; }

.sheet-body { padding: 12px 18px 20px; overflow-y: auto; min-height: 0; line-height: 1.6; }

.notice-links { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 6px; }

.notice { display: grid; gap: 2px; padding: 10px 0; border-bottom: 1px solid var(--line); }

.belts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }

.sheet.board { height: min(640px, 100%); border-top-color: var(--cat); }
.sheet.board .sheet-body { flex: 1; font-size: 17px; }

.sheet.board .tabs button[aria-selected="true"] { background: var(--tab); color: #fff; }

.sheet.board .notice b { font-size: 20px; color: var(--ink); }
.sheet.board .notice-links a { background: var(--cat); color: #fff; padding: 9px 14px; font-size: 16px; font-weight: 700; }
.sheet.board table { background: #fff; color: var(--ink); }
.sheet.board th { padding-left: 12px; background: var(--cat); color: #fff; font-size: 15px; }
.sheet.board td { padding: 12px 10px 12px 12px; font-size: 18px; }
.sheet.board td:first-child { font-family: var(--font-display); }
.sheet.board .belt-card { background: #fff; }
.sheet.board .belt-card b { font-size: 17px; color: var(--ink); }
.sheet.board .belt-card span { font-size: 15px; color: var(--ink); }
.sheet.board .board-foot { font-size: 15px; color: var(--ink); }
.stamp-head { margin: 0 0 12px; font-family: var(--font-display); font-size: 17px; }
.stamps { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.stamp { flex: 0 0 calc(25% - 6px); border: 1px solid var(--line); background: #fff; color: var(--ink); padding: 10px 4px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; line-height: 1.25; }
.stamp b { font-family: var(--font-display); font-weight: 400; font-size: 15px; }
.stamp small { font-size: 12px; color: var(--ink-soft); }
.stamp-seal { width: 60px; height: 60px; flex: none; display: flex; align-items: center; justify-content: center; border: 2px dashed #9aa3b5; border-radius: 50%; font-size: 13px; font-weight: 700; color: var(--ink-soft); }
.stamp.done .stamp-seal { border: 3px solid var(--hong); transform: rotate(-10deg); background: #fff; }
.stamp-seal img { width: 42px; height: 42px; object-fit: contain; }
.stamp-news { color: var(--gold); font-family: var(--font-display); font-size: 19px; }
.stamp-share { display: block; width: 100%; margin-top: 12px; padding: 11px; border: 0; background: var(--ink); color: var(--dobok); font-size: 15px; font-weight: 700; }
@media (min-width: 620px) { .sheet.board .tabs { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.viewer img { display: block; width: 100%; max-height: 62vh; object-fit: contain; background: #0c1122; }
.viewer-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 10px; }
.viewer-row button { border: 0; background: var(--ink); color: var(--dobok); padding: 8px 14px; }
.viewer-row button:disabled { opacity: .3; cursor: default; }

.game {
  position: fixed; inset: 0; z-index: 6; background: var(--ink); color: var(--dobok); overflow: hidden;
  display: flex; flex-direction: column; touch-action: manipulation; user-select: none; -webkit-user-select: none;
  padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.game-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex: none; }
.game-stats { display: flex; gap: 18px; font-variant-numeric: tabular-nums; }
.game-stats b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 24px; line-height: 1.1; }
.game-stats span { font-size: 12px; opacity: .8; }
.game .close { background: var(--dobok); color: var(--ink); }
.game-call { flex: none; height: 62px; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 38px; }
.game-call.perfect { color: var(--gold); }
.game-call.miss { color: #8d97b2; }
.mits { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; gap: clamp(16px, 7vw, 72px); }
.mit {
  position: relative; border: 0; padding: 0; color: #fff; flex: none; border-radius: 50%;

.mit.cheong { background: #1d5dc2; }

.ring { position: absolute; inset: 0; border-radius: 50%; border: 6px solid var(--dobok); pointer-events: none; opacity: 0; }
.game-foot { flex: none; text-align: center; font-size: 13px; opacity: .85; min-height: 20px; padding-top: 12px; }
.game-card {

  align-items: center; justify-content: center; text-align: center; gap: 12px;

  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.game-card h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 34px; text-wrap: balance; }
.game-card p { margin: 0; max-width: 34ch; line-height: 1.6; }
.belt-bar { width: min(240px, 70%); height: 22px; border: 2px solid rgba(255,255,255,.5); }
.game-card .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding-top: 6px; }

.shot-canvas { flex: 1; min-height: 0; width: 100%; display: block; margin-top: 10px; touch-action: none; }
.shot-call { position: absolute; left: 0; right: 0; top: 24%; text-align: center; pointer-events: none; font-family: var(--font-display); font-size: 40px; color: var(--ink); text-shadow: 0 0 10px #fff, 0 0 4px #fff; }
.shot-call.good { color: var(--hong); }
.quiz { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; justify-content: center; gap: 18px; width: 100%; max-width: 520px; margin-inline: auto; }
.quiz-q { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 26px; text-align: center; text-wrap: balance; }
.quiz-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.quiz-options button { border: 0; background: var(--dobok); color: var(--ink); font-size: 17px; font-weight: 700; padding: 16px 8px; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 8px; }
.quiz-options button i { width: 22px; height: 12px; flex: none; border: 1px solid rgba(0,0,0,.3); }

.doodle-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 10px 0; }

.doodle-note { margin: 0; font-size: 14px; color: var(--ink-soft); }
.doodle-main { display: block; width: 100%; margin-top: 10px; padding: 12px; border: 0; background: var(--hong); color: #fff; font-size: 16px; font-weight: 700; }
.doodle-main:disabled { opacity: .5; }
.doodle-pad { display: block; width: min(100%, 44dvh); aspect-ratio: 1; margin: 0 auto; background: #fff; border: 2px solid var(--ink); touch-action: none; }
.doodle-ink { height: 8px; margin: 8px auto; width: min(100%, 44dvh); background: #dfe2e8; }
.doodle-ink i { display: block; height: 100%; width: 100%; background: var(--ink); }
.doodle-row { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; margin-top: 8px; }
.doodle-color { width: 40px; height: 40px; border: 2px solid #fff; outline: 1px solid var(--line); padding: 0; }
.doodle-color.on { outline: 3px solid var(--ink); }
.doodle-tool { border: 1px solid var(--line); background: #fff; color: var(--ink); padding: 9px 14px; font-size: 14px; font-weight: 700; }
.doodle-code { width: 110px; padding: 9px; font-size: 16px; border: 1px solid var(--line); text-align: center; }
.menu-room { margin: 12px 0 6px; font-family: var(--font-display); font-weight: 400; font-size: 18px; }
.menu-room:first-child { margin-top: 0; }
.menu-row { display: flex; flex-wrap: wrap; gap: 8px; }
.menu-row button { border: 0; background: var(--ink); color: var(--dobok); padding: 11px 16px; font-size: 15px; font-weight: 700; }
.fail { position: fixed; inset: 0; z-index: 9; display: flex; align-items: center; justify-content: center; text-align: center; padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--ink); line-height: 1.7; }

<script>
// 도장 정보: 내용이 바뀌면 이 부분만 고치면 된다. 안내문은 mastertkd-sandong.kr 내용을 옮겼다.
const DOJANG = {
  name: '국가대표 마스터 태권도장',

const store = {

};

function showFail(msg) { const f = $('fail'); f.textContent = msg; f.hidden = false; }
const stampOf = id => DOJANG.stamps.find(s => s.id === id);
function stampBest(s) { return Number(store.get(s.id === 'mit' ? 'dojang-best' : 'dojang-best-' + s.id)) || 0; }
function stampDone(s) { return stampBest(s) >= s.need; }
// 금메달는 한 번 받으면 유지한다. 게임이 늘기 전에 8개를 다 찍은 아이도 보상을 유지한다
const STAMPS_ADDED = ['tidy', 'fold'];
function goldEarned() {
  if (!store.get('dojang-gold-checked')) {
    store.set('dojang-gold-checked', '1');
    if (DOJANG.stamps.filter(s => !STAMPS_ADDED.includes(s.id)).every(stampDone)) store.set('dojang-gold', '1');
  }
  if (DOJANG.stamps.every(stampDone)) store.set('dojang-gold', '1');
  return store.get('dojang-gold') === '1';
}
function stampGoal(id) {
  const s = stampOf(id);
  return `<p>${stampDone(s) ? '도장을 찍은 게임이에요' : `${s.need}${s.unit} 이상이면 도장을 찍어요`}</p>`;
}

// 오늘 방문자를 센다. 실패해도 둘러보기에는 영향이 없고 숫자만 안 보인다
async function countVisit() {
  const v = DOJANG.visits;
  if (location.hostname !== v.host || !window.crypto || !crypto.randomUUID) return;
  let id = store.get('dojang-visitor');
  if (!id) { id = crypto.randomUUID(); store.set('dojang-visitor', id); }
  try {
    const res = await fetch(v.url, {
      method: 'POST',
      headers: { apikey: v.key, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_site: v.site, p_visitor: id })
    });
    if (!res.ok) return;
    $('visits').textContent = `오늘 방문자 ${await res.json()}명`;
    $('visits').hidden = false;
  } catch (e) {}
}

  // 255, 색 번호 다음에 x, y가 이어진다. 좌표는 0~254
  function drawDoodle(g, bytes, size) {
    const k = size / 254, colors = DOJANG.doodle.colors;
    g.lineCap = g.lineJoin = 'round';
    g.lineWidth = Math.max(1.5, 6 * k);
    let i = 0, open = false, first = false;
    while (i + 1 < bytes.length) {

        if (open) g.stroke();
        g.strokeStyle = colors[bytes[i + 1]] || colors[0];
        g.beginPath();
        open = first = true;
      } else if (open) {
        const x = bytes[i] * k, y = bytes[i + 1] * k;
        if (first) { g.moveTo(x, y); first = false; }
        g.lineTo(x, y);
      }
      i += 2;
    }
    if (open) g.stroke();
  }

  function openDoodlePad() {
    openSheet('낙서 그리기');

    pad.className = 'doodle-pad';

    const ink = document.createElement('i'); inkBar.appendChild(ink);
    let strokes = [], color = 0, drawing = null;
    const used = () => strokes.reduce((n, s) => n + 2 + s.pts.length, 0);
    const toBytes = () => {
      const out = [];
      strokes.forEach(s => out.push(255, s.color, ...s.pts));
      return out;
    };
    const redraw = () => {
      g.clearRect(0, 0, 508, 508);
      drawDoodle(g, Uint8Array.from(toBytes()), 508);

    const pos = e => {
      const r = pad.getBoundingClientRect();
      const clamp = v => Math.max(0, Math.min(254, Math.round(v)));
      return [clamp((e.clientX - r.left) / r.width * 254), clamp((e.clientY - r.top) / r.height * 254)];
    };

      if (drawing || used() + 6 > DOODLE_MAX) return;
      e.preventDefault();
      pad.setPointerCapture(e.pointerId);

      drawing = { id: e.pointerId, stroke: { color, pts: [x, y, x, y] } };
      strokes.push(drawing.stroke);

    pad.addEventListener('pointermove', e => {

    const palette = document.createElement('div'); palette.className = 'doodle-row';

  // ---------- 미트 격파 ----------
  const TOTAL = 12;

    o.connect(g).connect(audio.destination);

  function setCard(html) { const c = $('gCard'); c.innerHTML = html; c.hidden = false; }

  function closeGame() {

  function gameLoop(now) {
    if (!game) return;

        game.start = now;

  function judge(side, now) {

  // ---------- 축구·농구 ----------
  // 게임 안 좌표: x 좌우, y 높이, z 앞쪽 거리(m). 공은 z=0에서 출발해 화면을 쓸어 올린 만큼 날아간다
  const SHOTS = 8, GRAVITY = 9.8;
  const SHOT_INFO = {
    soccer: { title: '축구', help: '공을 위로 쓱 밀어서 차세요. 옆으로 밀면 그쪽으로, 길게 밀면 높게 날아가요. 골키퍼를 피해서 넣어보세요.', foot: '화면을 위로 쓸어서 슛!', r: .17, y0: .17 },
    basket: { title: '농구', help: '공을 위로 쓱 밀어서 던지세요. 길게 밀수록 멀리 날아가요. 골대가 점점 멀어져요.', foot: '화면을 위로 쓸어서 슛!', r: .16, y0: 1.1 }
  };

      { part: 'foldH', dir: h, say: h === 'right' ? '왼쪽을 오른쪽으로 접어요' : '오른쪽을 왼쪽으로 접어요' },

      g.beginPath(); g.arc(xm, ay, r, 0, 7); g.stroke();
      g.fillStyle = beltStyle(); g.strokeStyle = '#1a1a1f'; g.lineWidth = 1.5;
      g.fillRect(xm - r * .35, ay - r * .35, r * .7, r * .7); g.strokeRect(xm - r * .35, ay - r * .35, r * .7, r * .7);
    } else {
      const a = { right: 0, down: Math.PI / 2, left: Math.PI, up: -Math.PI / 2 }[cur.dir], len = Math.max(44, tw * .5), wide = Math.max(12, tw * .1);
      g.save();
      g.translate(ax + Math.cos(a) * bounce, ay + Math.sin(a) * bounce);
      g.rotate(a);
      g.fillStyle = '#e0a81c'; g.strokeStyle = '#161f38'; g.lineWidth = 2; g.lineJoin = 'round';
      g.beginPath();
      g.moveTo(-len / 2, -wide / 2); g.lineTo(len * .1, -wide / 2); g.lineTo(len * .1, -wide * 1.2); g.lineTo(len / 2, 0);
      g.lineTo(len * .1, wide * 1.2); g.lineTo(len * .1, wide / 2); g.lineTo(-len / 2, wide / 2); g.closePath();
      g.fill(); g.stroke();
      g.restore();
    }
  }
  // 컵 피라미드 자리: 아래층부터 쌓는다
  function cupLevel(s) {
    const n = s.level === 0 ? 3 : 4;
    s.base = n;
    s.slots = [];
    for (let row = 0; row < n; row++) for (let i = 0; i < n - row; i++) s.slots.push({ row, i, count: n - row });
    s.n = 0; s.x = 40; s.dir = 1; s.fall = null; s.placedHere = []; s.wait = .2;
    return s;
  }
  function cupLayout(s, W, H) {
    const cw = Math.min(W * .85 / Math.max(s.base, 4), 90), ch = cw * 1.05, floorY = H * .82;
    return {
      cw, ch, top: Math.max(cw * 1.1, H * .14),
      x: slot => W / 2 + (slot.i - (slot.count - 1) / 2) * cw,
      y: slot => floorY - slot.row * ch
    };
  }
  const PAD_COUNT = 9;
  function padRect(i) {
    const gap = 8, w = (mW - gap * 4) / 3, h = (mH - gap * 4) / 3;
    return { x: gap + (i % 3) * (w + gap), y: gap + Math.floor(i / 3) * (h + gap), w, h };
  }
  function padAt(x, y) {
    for (let i = 0; i < PAD_COUNT; i++) { const r = padRect(i); if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return i; }
    return -1;
  }
  function padNext(s) {
    let n = s.target;
    while (n === s.target) n = Math.floor(Math.random() * PAD_COUNT);
    s.target = n;
    s.maxLife = s.life = Math.max(.6, 1.2 - (20 - s.left) * .03);
  }
  function renderQuiz(s) {
    const body = $('mBody');
    body.textContent = '';
    const q = document.createElement('h3');
    q.className = 'quiz-q';
    body.appendChild(q);
    const list = document.createElement('div');
    list.className = 'quiz-options';
    body.appendChild(list);
    if (s.i < s.qs.length) {
      const item = s.qs[s.i];
      q.textContent = `${s.i + 1}. ${item.ask}`;
      item.options.forEach(opt => {
        const b = document.createElement('button');
        b.textContent = opt;
        b.addEventListener('click', () => {
          [...list.children].forEach(x => { x.disabled = true; if (x.textContent === item.answer) x.classList.add('right'); });
          const ok = opt === item.answer;
          if (!ok) b.classList.add('wrong');
          if (ok) s.score += 10;
          thwack(ok ? 320 : 90, .3);
          s.i++;
          miniStats();
          setTimeout(() => { if (mini && mini.s === s) renderQuiz(s); }, ok ? 650 : 1200);
        });
        list.appendChild(b);
      });
      return;
    }
    // 마지막 문제: 낮은 띠부터 차례로 누르기
    if (!s.order) {
      const pick = shuffled(BELTS.map((b, i) => i)).slice(0, 5);
      s.order = { rest: pick.slice().sort((a, b) => a - b), pick, wrong: 0 };
    }
    q.textContent = '9. 낮은 띠부터 차례로 누르세요';
    shuffled(s.order.pick).forEach(idx => {
      const b = document.createElement('button');
      const swatch = document.createElement('i');
      swatch.style.background = BELTS[idx].css;
      b.append(swatch, BELTS[idx].name);
      b.addEventListener('click', () => {
        if (idx === s.order.rest[0]) {
          s.order.rest.shift();
          b.disabled = true;
          b.classList.add('right');
          thwack(320, .25);
          if (!s.order.rest.length) {
            if (!s.order.wrong) s.score += 20;
            s.i++;
            miniStats();
            setTimeout(() => { if (mini && mini.s === s) finishMini(s.score, `100점 만점에 ${s.score}점이에요`); }, 700);
          }
        } else {
          s.order.wrong++;
          b.classList.add('wrong');
          setTimeout(() => b.classList.remove('wrong'), 300);
          thwack(90, .25);
        }
      });
      list.appendChild(b);
    });
  }
  function openGameMenu() {
    openSheet('게임');
    const body = $('sheetBody');
    [['1관', ['미트 격파', '축구', '농구', '줄넘기', '품새 퀴즈']], ['2관', ['매트 달리기', '쿠션 벽 터치']], ['휴게실', ['컵 쌓기', '낙서장']], ['탈의실', ['탈의실 정리', '도복 개기']]].forEach(([room, names]) => {
      const h = document.createElement('h3');
      h.className = 'menu-room';
      h.textContent = room;
      body.appendChild(h);
      const row = document.createElement('div');
      row.className = 'menu-row';
      names.forEach(name => {
        const b = document.createElement('button');
        b.textContent = name;
        b.addEventListener('click', () => { closeSheet(); goToHotspot(hotspots.find(x => x.name === name)); });
        row.appendChild(b);
      });
      body.appendChild(row);
    });
  }

  // ---------- 벽 투명 처리 ----------
  function segHitsBox(a, b, min, max) {
    let t0 = 0, t1 = 1;
    for (const k of ['x', 'y', 'z']) {
      const d = b[k] - a[k];
      if (Math.abs(d) < 1e-6) { if (a[k] < min[k] || a[k] > max[k]) return false; continue; }
      let n = (min[k] - a[k]) / d, f = (max[k] - a[k]) / d;
      if (n > f) [n, f] = [f, n];
      t0 = Math.max(t0, n); t1 = Math.min(t1, f);
      if (t0 > t1) return false;
    }
    return true;
  }
  const head = new THREE.Vector3();
  function updateWalls(dt) {
    head.set(player.x, 1, player.z);
    const p = camera.position;
    walls.forEach(w => {
      const fade = (w.side === 's' && p.z > w.at && !(w.keepOutside && player.x >= 14 && player.z > w.at)) || (w.side === 'n' && p.z < w.at) || (w.side === 'e' && p.x > w.at && !(w.keepOutside && player.x >= 14)) || (w.side === 'w' && p.x < w.at)
        || w.boxes.some(b => segHitsBox(p, head, b.min, b.max));
      const goal = fade ? .1 : 1;
      if (w.opacity !== goal) {
        w.opacity += (goal - w.opacity) * Math.min(1, dt * 9);
        if (Math.abs(w.opacity - goal) < .01) w.opacity = goal;
        w.mats.forEach(m => { m.opacity = w.opacity; m.transparent = w.opacity < 1; m.depthWrite = w.opacity >= 1; });
        w.decor.forEach(d => { d.visible = w.opacity > .6; });
      }
    });
  }

  // ---------- 매 프레임 ----------
  function resize() {
    renderer.setSize(innerWidth, innerHeight, false);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize);
  resize();

  let last = performance.now(), clock = 0, whereName = '';
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(.1, (now - last) / 1000);
    last = now;
    if (!$('game').hidden || !$('shot').hidden || !$('mini').hidden) return; // 게임 중에는 3D 그리기를 쉰다
    clock += dt;
    let mx = 0, mz = 0;
    if (keys.size && $('veil').hidden) {
      const f = (keys.has('KeyW') || keys.has('ArrowUp') ? 1 : 0) - (keys.has('KeyS') || keys.has('ArrowDown') ? 1 : 0);
      const s = (keys.has('KeyD') || keys.has('ArrowRight') ? 1 : 0) - (keys.has('KeyA') || keys.has('ArrowLeft') ? 1 : 0);
      const sin = Math.sin(view.yaw), cos = Math.cos(view.yaw);
      mx = -sin * f + cos * s;
      mz = -cos * f - sin * s;
      player.path = []; player.pending = null;
    }
    if (!mx && !mz && player.path.length && $('veil').hidden) {
      const [tx, tz] = player.path[0];
      const dx = tx - player.x, dz = tz - player.z, d = Math.hypot(dx, dz);
      if (d < .15) {
        player.path.shift();
        player.stall = 0;
        if (!player.path.length && player.pending) { const h = player.pending; player.pending = null; h.open(); }
      } else { mx = dx / d; mz = dz / d; }
    }
    const len = Math.hypot(mx, mz);
    let walking = false;
    if (len > 0) {
      mx /= len; mz /= len;
      const before = player.path.length ? Math.hypot(player.path[0][0] - player.x, player.path[0][1] - player.z) : 0;
      walking = step(mx * SPEED * dt, mz * SPEED * dt);
      player.dir = Math.atan2(mx, mz);
      if (player.path.length) {
        const after = Math.hypot(player.path[0][0] - player.x, player.path[0][1] - player.z);
        player.stall = after < before - SPEED * dt * .15 ? 0 : player.stall + dt;
        if (player.stall > .5) { player.path = []; player.pending = null; player.stall = 0; }
      }
    }
    me.root.position.set(player.x, 0, player.z);
    let turn = player.dir - me.root.rotation.y;
    turn = Math.atan2(Math.sin(turn), Math.cos(turn));
    me.root.rotation.y += turn * Math.min(1, dt * 14);
    player.walk = walking ? player.walk + dt * 12 : 0;
    const swing = Math.sin(player.walk) * (walking ? .7 : 0);
    me.legL.rotation.x = swing; me.legR.rotation.x = -swing;
    me.armL.rotation.x = -swing; me.armR.rotation.x = swing;
    if (!calm) {
      kids.forEach(k => {
        const t = (clock * .7 + k.phase) % 2.4;
        const kick = t < .5 ? Math.sin(t / .5 * Math.PI) : 0;
        k.c.legR.rotation.x = -kick * 1.7;
        k.c.armL.rotation.x = -kick * .5;
        k.c.armR.rotation.x = kick * .5;
      });
      labels.forEach(l => { l.sp.position.y = l.y + Math.sin(clock * 2 + l.phase) * .07; });
    }
    if (tapRing.material.opacity > 0) tapRing.material.opacity = Math.max(0, tapRing.material.opacity - dt * 1.4);

    // 입구 앞에서는 간판과 문이 화면에 들어오도록 문 쪽을 함께 비춘다
    view.target.lerp(head.set(player.x - (player.x >= 14 ? 1.2 : 0), .8, player.z), Math.min(1, dt * 6));
    if (autoCam === 'wait' && player.x < 14.6) autoCam = 'turn';
    if (autoCam === 'turn') {
      const ease = Math.min(1, dt * 1.6);
      view.yaw += (insideView.yaw - view.yaw) * ease;
      view.pitch += (insideView.pitch - view.pitch) * ease;
      view.dist += (insideView.dist - view.dist) * ease;
      if (Math.abs(view.dist - insideView.dist) < .2) autoCam = null;
    }
    const cp = Math.cos(view.pitch);
    camera.position.set(
      view.target.x + view.dist * Math.sin(view.yaw) * cp,
      view.target.y + view.dist * Math.sin(view.pitch),
      view.target.z + view.dist * Math.cos(view.yaw) * cp);
    camera.lookAt(view.target);
    updateWalls(dt);
    const doorNear = Math.hypot(player.x - 14, player.z - 17.2) < 2.6;
    doorOpen.amount += ((doorNear ? 1 : 0) - doorOpen.amount) * Math.min(1, dt * 6);
    doorPanelN.position.z = doorOpen.n - doorOpen.amount * .92;
    doorPanelS.position.z = doorOpen.s + doorOpen.amount * .92;
    entryLabel.visible = player.x >= 14;

    const room = roomAt(player.x, player.z);
    if (room !== whereName) { whereName = room; $('where').textContent = ROOM_NAMES[room]; }
    const near = hotspots.find(h => h.action && Math.hypot(h.stand[0] - player.x, h.stand[1] - player.z) < 1.2) || null;
    if (near !== nearSpot) {
      nearSpot = near;
      $('action').hidden = !near;
      if (near) $('action').textContent = near.action;
    }
    renderer.render(scene, camera);
  }
  requestAnimationFrame(frame);
}
boot();
</script>
