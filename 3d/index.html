:root {
  color-scheme: dark;
  --ink: #161f38;
  --ink-soft: #4b5674;
  --dobok: #f4f6f5;
  --line: #d5dae2;
  --cheong: #1f3f94;
  --hong: #b92a2c;
  --gold: #d9a93a;
  --font-display: "Black Han Sans", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --font-body: "Gowun Dodum", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--ink); color: var(--dobok); font-family: var(--font-body); font-size: 15px; }
button { font: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.hud-top {
  position: fixed; z-index: 2; pointer-events: none;
  top: calc(12px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
}
.brand { display: flex; align-items: center; gap: 8px; min-width: 0; font-family: var(--font-display); font-size: 21px; line-height: 1.15; text-shadow: 0 1px 6px rgba(0,0,0,.55); }
.brand img { height: 40px; width: auto; flex: none; }
.intro img { width: 92px; height: auto; align-self: center; }
.hud-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
.home-link { pointer-events: auto; background: rgba(22,31,56,.86); color: var(--dobok); font-size: 13px; padding: 4px 10px; text-decoration: none; }
.where { font-family: var(--font-display); font-size: 15px; background: var(--dobok); color: var(--ink); padding: 5px 12px; white-space: nowrap; }
.hint {
  position: fixed; z-index: 2; pointer-events: none; left: 50%; transform: translateX(-50%);
  top: calc(56px + env(safe-area-inset-top, 0px));
  width: max-content; max-width: calc(100% - 32px); text-align: center;
  background: rgba(22,31,56,.86); padding: 7px 14px; font-size: 13px; transition: opacity .4s;
}
.hint.gone { opacity: 0; }
.hud-bottom {
  position: fixed; z-index: 2; pointer-events: none;
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));

.hud-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.action { pointer-events: auto; border: 0; background: var(--hong); color: #fff; font-family: var(--font-display); font-size: 17px; padding: 10px 20px; }
.action.alt { background: var(--cheong); }
.places { pointer-events: auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; }
.places button { border: 0; background: var(--dobok); color: var(--ink); padding: 8px 11px; font-size: 14px; font-weight: 700; }
.places button:hover { background: #fff; }

.veil {
  position: fixed; inset: 0; z-index: 5; background: rgba(10,15,30,.6);
  display: flex; align-items: center; justify-content: center;
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet { background: var(--dobok); color: var(--ink); width: 100%; max-width: 640px; max-height: 100%; display: flex; flex-direction: column; min-width: 0; border-top: 8px solid var(--ink); }
.sheet header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 18px 8px; }
.sheet h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 24px; text-wrap: balance; }
.close { border: 0; background: var(--ink); color: var(--dobok); padding: 7px 13px; font-size: 14px; flex: none; }
.tabs { display: flex; gap: 4px; padding: 0 18px; border-bottom: 2px solid var(--ink); overflow-x: auto; flex: none; scrollbar-width: none; }
.tabs button { border: 0; background: none; color: var(--ink-soft); padding: 8px 10px; font-size: 15px; font-weight: 700; white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--dobok); }
.sheet-body { padding: 12px 18px 20px; overflow-y: auto; min-height: 0; line-height: 1.6; }
.board-foot { margin: 12px 0 0; font-size: 14px; color: var(--ink-soft); }
.notice-links { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 6px; }
.notice-links a { background: var(--ink); color: var(--dobok); padding: 6px 12px; font-size: 14px; text-decoration: none; }
.notice { display: grid; gap: 2px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.notice:last-child { border-bottom: 0; }
.notice b { font-size: 16px; }
.notice time { font-size: 13px; color: var(--ink-soft); }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 13px; color: var(--ink-soft); }
.belts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.belt-card { border: 1px solid var(--line); padding: 8px 10px; min-width: 0; line-height: 1.4; }
.belt-card i { display: block; height: 10px; margin-bottom: 6px; border: 1px solid rgba(0,0,0,.2); }
.belt-card b { display: block; }
.belt-card span { font-size: 13px; color: var(--ink-soft); }
.viewer img { display: block; width: 100%; max-height: 62vh; object-fit: contain; background: #0c1122; }
.viewer-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 10px; }
.viewer-row button { border: 0; background: var(--ink); color: var(--dobok); padding: 8px 14px; }
.viewer-row button:disabled { opacity: .3; cursor: default; }

.game {
  position: fixed; inset: 0; z-index: 6; background: var(--ink); color: var(--dobok); overflow: hidden;
  display: flex; flex-direction: column; touch-action: manipulation; user-select: none; -webkit-user-select: none;

  padding-left: max(16px, env(safe-area-inset-left, 0px));

.game-stats { display: flex; gap: 18px; font-variant-numeric: tabular-nums; }
.game-stats b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 24px; line-height: 1.1; }
.game-stats span { font-size: 12px; opacity: .8; }
.game .close { background: var(--dobok); color: var(--ink); }
.game-call { flex: none; height: 62px; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 38px; }
.game-call.perfect { color: var(--gold); }
.game-call.miss { color: #8d97b2; }
.mits { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; gap: clamp(16px, 7vw, 72px); }
.mit {

  font-family: var(--font-display); font-size: clamp(34px, 9vw, 60px);

.mit.cheong { background: #1d5dc2; }
.mit.hong { background: #d6322a; }
.mit.hit { animation: thump .16s ease-out; }
@keyframes thump { 40% { transform: scale(.88); filter: brightness(1.45); } }
.ring { position: absolute; inset: 0; border-radius: 50%; border: 6px solid var(--dobok); pointer-events: none; opacity: 0; }
.game-foot { flex: none; text-align: center; font-size: 13px; opacity: .85; min-height: 20px; padding-top: 12px; }
.game-card {
  position: absolute; inset: 0; z-index: 1; background: var(--ink); display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));

.game-card h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 34px; text-wrap: balance; }
.game-card p { margin: 0; max-width: 34ch; line-height: 1.6; }
.belt-bar { width: min(240px, 70%); height: 22px; border: 2px solid rgba(255,255,255,.5); }
.game-card .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding-top: 6px; }
.btn-main { border: 0; background: var(--hong); color: #fff; font-family: var(--font-display); font-size: 20px; padding: 12px 28px; }
.btn-sub { border: 0; background: var(--dobok); color: var(--ink); font-size: 15px; font-weight: 700; padding: 12px 18px; }
.shot-canvas { flex: 1; min-height: 0; width: 100%; display: block; margin-top: 10px; touch-action: none; }
.shot-call { position: absolute; left: 0; right: 0; top: 24%; text-align: center; pointer-events: none; font-family: var(--font-display); font-size: 40px; color: var(--ink); text-shadow: 0 0 10px #fff, 0 0 4px #fff; }
.shot-call.good { color: var(--hong); }
.fail { position: fixed; inset: 0; z-index: 9; display: flex; align-items: center; justify-content: center; text-align: center; padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--ink); line-height: 1.7; }
@media (prefers-reduced-motion: reduce) { .mit.hit { animation: none; } .hint { transition: none; } }
</style>

    let mx = 0, mz = 0;
    if (keys.size && $('veil').hidden) {
      const f = (keys.has('KeyW') || keys.has('ArrowUp') ? 1 : 0) - (keys.has('KeyS') || keys.has('ArrowDown') ? 1 : 0);
      const s = (keys.has('KeyD') || keys.has('ArrowRight') ? 1 : 0) - (keys.has('KeyA') || keys.has('ArrowLeft') ? 1 : 0);
      const sin = Math.sin(view.yaw), cos = Math.cos(view.yaw);
      mx = -sin * f + cos * s;
      mz = -cos * f - sin * s;
      player.path = []; player.pending = null;
    }
    if (!mx && !mz && player.path.length && $('veil').hidden) {
      const [tx, tz] = player.path[0];
      const dx = tx - player.x, dz = tz - player.z, d = Math.hypot(dx, dz);
      if (d < .15) {
        player.path.shift();
        player.stall = 0;
        if (!player.path.length && player.pending) { const h = player.pending; player.pending = null; h.open(); }
      } else { mx = dx / d; mz = dz / d; }
    }
    const len = Math.hypot(mx, mz);
    let walking = false;
    if (len > 0) {
      mx /= len; mz /= len;
      const before = player.path.length ? Math.hypot(player.path[0][0] - player.x, player.path[0][1] - player.z) : 0;
      walking = step(mx * SPEED * dt, mz * SPEED * dt);
      player.dir = Math.atan2(mx, mz);
      if (player.path.length) {
        const after = Math.hypot(player.path[0][0] - player.x, player.path[0][1] - player.z);
        player.stall = after < before - SPEED * dt * .15 ? 0 : player.stall + dt;
        if (player.stall > .5) { player.path = []; player.pending = null; player.stall = 0; }
      }
    }
    me.root.position.set(player.x, 0, player.z);
    let turn = player.dir - me.root.rotation.y;
    turn = Math.atan2(Math.sin(turn), Math.cos(turn));
    me.root.rotation.y += turn * Math.min(1, dt * 14);
    player.walk = walking ? player.walk + dt * 12 : 0;
    const swing = Math.sin(player.walk) * (walking ? .7 : 0);
    me.legL.rotation.x = swing; me.legR.rotation.x = -swing;
    me.armL.rotation.x = -swing; me.armR.rotation.x = swing;
    if (!calm) {
      kids.forEach(k => {
        const t = (clock * .7 + k.phase) % 2.4;
        const kick = t < .5 ? Math.sin(t / .5 * Math.PI) : 0;
        k.c.legR.rotation.x = -kick * 1.7;
        k.c.armL.rotation.x = -kick * .5;
        k.c.armR.rotation.x = kick * .5;
      });
      labels.forEach(l => { l.sp.position.y = l.y + Math.sin(clock * 2 + l.phase) * .07; });
    }
    if (tapRing.material.opacity > 0) tapRing.material.opacity = Math.max(0, tapRing.material.opacity - dt * 1.4);

    // 입구 앞에서는 간판과 문이 화면에 들어오도록 문 쪽을 함께 비춘다
    view.target.lerp(head.set(player.x - (player.x >= 14 ? 1.2 : 0), .8, player.z), Math.min(1, dt * 6));
    if (autoCam === 'wait' && player.x < 14.6) autoCam = 'turn';
    if (autoCam === 'turn') {
      const ease = Math.min(1, dt * 1.6);
      view.yaw += (insideView.yaw - view.yaw) * ease;
      view.pitch += (insideView.pitch - view.pitch) * ease;
      view.dist += (insideView.dist - view.dist) * ease;
      if (Math.abs(view.dist - insideView.dist) < .2) autoCam = null;
    }
    const cp = Math.cos(view.pitch);
    camera.position.set(
      view.target.x + view.dist * Math.sin(view.yaw) * cp,
      view.target.y + view.dist * Math.sin(view.pitch),
      view.target.z + view.dist * Math.cos(view.yaw) * cp);
    camera.lookAt(view.target);
    updateWalls(dt);
    const doorNear = Math.hypot(player.x - 14, player.z - 17.2) < 2.6;
    doorOpen.amount += ((doorNear ? 1 : 0) - doorOpen.amount) * Math.min(1, dt * 6);
    doorPanelN.position.z = doorOpen.n - doorOpen.amount * .92;
    doorPanelS.position.z = doorOpen.s + doorOpen.amount * .92;
    entryLabel.visible = player.x >= 14;

    const room = roomAt(player.x, player.z);
    if (room !== whereName) { whereName = room; $('where').textContent = ROOM_NAMES[room]; }
    const near = hotspots.find(h => h.action && Math.hypot(h.stand[0] - player.x, h.stand[1] - player.z) < 1.2) || null;
    if (near !== nearSpot) {
      nearSpot = near;
      $('action').hidden = !near;
      if (near) $('action').textContent = near.action;
    }
    renderer.render(scene, camera);
  }
  requestAnimationFrame(frame);
}
boot();
</script>
